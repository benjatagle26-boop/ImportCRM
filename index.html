function productRow(i, p) {
  const sub = (Number(p.qty)||0)*(Number(p.price)||0)
  return `<div style="display:grid;grid-template-columns:2.2fr 90px 100px 100px 28px;gap:7px;margin-bottom:6px" id="prow-${i}">
    <input class="input" style="font-size:12px" value="${p.desc||''}" placeholder="Descripción" oninput="updateProdSub(${i})"/>
    <input class="input" style="font-size:12px" type="number" min="0" value="${p.qty||''}" oninput="updateProdSub(${i})"/>
    <input class="input" style="font-size:12px" type="number" min="0" step="0.01" value="${p.price||''}" oninput="updateProdSub(${i})"/>
    <div style="font-size:13px;font-weight:700;color:var(--blue-t);padding:8px 4px;font-family:var(--mono)" id="psub-${i}">${fmtUSD(sub)}</div>
    <button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0" onclick="document.getElementById('prow-${i}').remove();recalcFOB()">×</button>
  </div>`
}

let _prowCount = 0
function addOrderProduct() {
  _prowCount++
  const div = document.createElement('div')
  div.innerHTML = productRow(_prowCount, {})
  document.getElementById('o-product-rows').appendChild(div.firstElementChild)
}

function updateProdSub(i) {
  const row = document.getElementById('prow-'+i)
  if(!row) return
  const inputs = row.querySelectorAll('input')
  const sub = (Number(inputs[1].value)||0)*(Number(inputs[2].value)||0)
  const subEl = document.getElementById('psub-'+i)
  if(subEl) subEl.textContent = fmtUSD(sub)
  recalcFOB()
}

function recalcFOB() {
  let total=0
  document.querySelectorAll('[id^="prow-"]').forEach(row=>{
    const inputs=row.querySelectorAll('input')
    total+=(Number(inputs[1]?.value)||0)*(Number(inputs[2]?.value)||0)
  })
  const el=document.getElementById('o-fob-total')
  if(el) el.textContent=fmtUSD(total)
}

function collectStep1() {
  const prov = document.getElementById('o-prov')?.value
  if(prov==='__new__') openModal('modal-supplier')
  const codeVal = document.getElementById('o-code')?.value.trim()
  if(codeVal) orderDraft.code = codeVal
  orderDraft.estado = document.getElementById('o-estado')?.value||'cotizacion'
  orderDraft.folderId = document.getElementById('o-folder')?.value||null

function commitOrder(close=true) {
  let orders = getOrders()
  const idx = orders.findIndex(o=>o.id===orderDraft.id)
  const wasEntregado = idx>=0 ? orders[idx].estado === 'entregado' : false
  const nowEntregado = orderDraft.estado === 'entregado'
  trackOrderChange(orderDraft, idx>=0 ? orders[idx].estado : null)
  if(idx>=0) orders[idx]=orderDraft
  else orders.push(orderDraft)
  saveOrders(orders)
  if(close) closeModal('modal-order')
  toast('Orden guardada ✓')
  renderPage()
  if (nowEntregado && !wasEntregado) {
    setTimeout(() => openRealValuesModal(orderDraft.id), 400)
  }
}

function saveRealValues(orderId) {
  const orders = getOrders()
  const oi = orders.findIndex(x=>x.id===orderId)
  if (oi<0) return
  const o = orders[oi]
  snapshotEstimate(o)
  const fob = Number(o.fob_total)||0

  const flete = parseFloat(document.getElementById('rv-flete').value)||0
  const seguro = parseFloat(document.getElementById('rv-seguro').value)||0
  const descuento = parseFloat(document.getElementById('rv-descuento').value)||0
  const di = parseFloat(document.getElementById('rv-di').value)||0
  const te = parseFloat(document.getElementById('rv-te').value)||0
  const iva = parseFloat(document.getElementById('rv-iva').value)||0
  const iva_ad = parseFloat(document.getElementById('rv-iva-ad').value)||0
  const ganancias = parseFloat(document.getElementById('rv-gan').value)||0
  const iibb = parseFloat(document.getElementById('rv-iibb').value)||0
  const despachante = parseFloat(document.getElementById('rv-desp').value)||0
  const thc = parseFloat(document.getElementById('rv-thc').value)||0
  const alma = parseFloat(document.getElementById('rv-alma').value)||0
  const swift = parseFloat(document.getElementById('rv-swift').value)||0
  const flete_int = parseFloat(document.getElementById('rv-flete-int').value)||0
  const banco = parseFloat(document.getElementById('rv-banco').value)||0
  const sim = parseFloat(document.getElementById('rv-sim').value)||0
  const fee = parseFloat(document.getElementById('rv-fee').value)||0

  const fobNeto = Math.max(0, fob - descuento)
  const total_trib = di+te+iva+iva_ad+ganancias+iibb
  const total_locales = despachante+thc+alma+swift+flete_int+banco+sim
  const cif = fobNeto+flete+seguro
  const landedTotal = cif+total_trib+total_locales+fee
  const costoDetalle = { di,te,iva,iva_ad,ganancias,iibb,seguro,descuento,fobNeto,total_trib,total_locales,total_fee:fee,iva_fee:0,
    detalle_locales:{despachante,thc,alma,swift,flete_int,banco,sim} }

  if (o.quoteId) {
    const quotes = getQuotes()
    const qi = quotes.findIndex(q=>q.id===o.quoteId)
    if (qi>=0) { quotes[qi].flete=flete; quotes[qi].landedTotal=landedTotal; quotes[qi].multiplo=fob?landedTotal/fob:0; quotes[qi].costoDetalle=costoDetalle; saveQuotes(quotes) }
  } else {
    orders[oi]._flete=flete; orders[oi]._landedTotal=landedTotal; orders[oi]._costoDetalle=costoDetalle
    saveOrders(orders)
  }
  orders[oi]._valoresReales = true
  saveOrders(orders)

  document.getElementById('modal-real-values').classList.remove('open')
  toast(`Valores reales guardados ✓ — Landed: ${fmtUSD(landedTotal)}`)
  if (currentPage === 'order') renderPage()
  setTimeout(() => openOrderSummaryModal(orderId), 500)
}

function getOrderSummaryData(orderId) {
  const o = getOrders().find(x=>x.id===orderId)
  if (!o) return null
  const co = getCompanies().find(c=>c.id===o.companyId)
  const linkedQuote = o.quoteId ? getQuotes().find(q=>q.id===o.quoteId) : null
  const cd = linkedQuote?.costoDetalle || o._costoDetalle || {}
  const flete = linkedQuote ? (Number(linkedQuote.flete)||0) : (Number(o._flete)||0)
  const fob = Number(o.fob_total)||0
  const landedTotal = linkedQuote ? (Number(linkedQuote.landedTotal)||0) : (Number(o._landedTotal)||0)
  const dl = cd.detalle_locales || {}

  // 5 grupos
  const groups = [
    {
      title: 'Flete Marítimo',
      color: '#1D4ED8',
      rows: [
        ['Flete marítimo', flete],
        ['Seguro', cd.seguro||0],
      ].filter(([,v])=>v>0)
    },
    {
      title: 'VEP Aduana (Impuestos)',
      color: '#DC2626',
      rows: [
        ['Derecho de Importación (DI)', cd.di||0],
        ['Tasa de Estadística (TE)', cd.te||0],
        ['IVA Importación', cd.iva||0],
        ['IVA Adicional', cd.iva_ad||0],
        ['Percepción Ganancias', cd.ganancias||0],
        ['Percepción IIBB', cd.iibb||0],
      ].filter(([,v])=>v>0)
    },
    {
      title: 'Gastos Locales (Depósito Fiscal)',
      color: '#D97706',
      rows: [
        ['THC / BL', dl.thc||0],
        ['Depósito fiscal / Almacenaje', dl.alma||0],
        ['SWIFT / transferencia', dl.swift||0],
        ['Flete interno', dl.flete_int||0],
        ['Gastos bancarios', dl.banco||0],
        ['SIM', dl.sim||0],
      ].filter(([,v])=>v>0)
    },
    {
      title: 'Despachante',
      color: '#6D28D9',
      rows: [
        ['Honorarios despachante', dl.despachante||0],
      ].filter(([,v])=>v>0)
    },
    {
      title: 'Fee de Gestión',
      color: '#059669',
      rows: [
        ['Fee de servicio', cd.total_fee||0],
      ].filter(([,v])=>v>0)
    },
  ]

  // Impuestos deducibles (créditos fiscales recuperables): IVA, IVA adicional, perc. Ganancias, IIBB
  const deducibles = (Number(cd.iva)||0)+(Number(cd.iva_ad)||0)+(Number(cd.ganancias)||0)+(Number(cd.iibb)||0)
  const totalSinDed = Math.max(0, landedTotal - deducibles)

  return { o, co, fob, flete, landedTotal, groups, multiplo: fob?landedTotal/fob:0, deducibles, totalSinDed }
}


function downloadOrderSummaryExcel(orderId) {
  const data = getOrderSummaryData(orderId)
  if (!data) return
  const { o, co, fob, landedTotal, groups, multiplo, totalSinDed } = data
  let csv = 'RESUMEN FINAL DE ORDEN\n'
  csv += `Orden,${o.code}\n`
  csv += `Empresa,${co?.nombre||''}\n`
  csv += `Proveedor,${o.proveedor||''}\n`
  csv += `Fecha,${new Date().toISOString().slice(0,10)}\n\n`

  groups.forEach(g => {
    if (!g.rows.length) return
    const subtotal = g.rows.reduce((s,[,v])=>s+v, 0)
    csv += `${g.title.toUpperCase()},${subtotal.toFixed(2)}\n`
    g.rows.forEach(([l,v]) => { csv += `  "${l}",${v.toFixed(2)}\n` })
    csv += '\n'
  })

  csv += `FOB Total,${fob.toFixed(2)}\n`
  csv += `Costo total sin impuestos deducibles,${totalSinDed.toFixed(2)}\n`
  csv += `COSTO TOTAL (con impuestos deducibles),${landedTotal.toFixed(2)}\n`
  csv += `Multiplo sobre FOB,${multiplo.toFixed(2)}x\n`
  const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `Resumen_${o.code}.csv`
  a.click()
  toast('Excel descargado ✓')
}

const FILE_TYPES = { 'factura':'Factura', 'bl':'Bill of Lading', 'packing':'Packing List', 'cert':'Certificado', 'doc':'Documento' }
function detectFileType(name) {
  const n=name.toLowerCase()
  if(n.includes('factura')||n.includes('invoice')) return 'factura'
  if(n.includes('bl')||n.includes('bill')) return 'bl'
  if(n.includes('packing')) return 'packing'
  if(n.includes('cert')) return 'cert'
  return 'doc'
}

function handleFileSelect(event, orderId) { processFiles(event.target.files, orderId) }
function handleFileDrop(event, orderId) {
  event.preventDefault()
  document.getElementById('file-drop-'+orderId)?.classList.remove('dragover')
  processFiles(event.dataTransfer.files, orderId)
}

function processFiles(files, orderId) {
  const orders=getOrders(); const idx=orders.findIndex(o=>o.id===orderId)
  if(idx<0) return
  if(!orders[idx].archivos) orders[idx].archivos=[]
  Array.from(files).forEach(f=>{
    const ext = f.name.split('.').pop()?.toLowerCase()||''
    const sizeKB = Math.round(f.size/1024)
    const size = sizeKB>1024 ? (sizeKB/1024).toFixed(1)+' MB' : sizeKB+' KB'
    orders[idx].archivos.push({ id:uid(), nombre:f.name, ext, size, tipo:detectFileType(f.name), fecha:new Date().toISOString().slice(0,10) })
  })
  saveOrders(orders); toast(`${files.length} archivo(s) agregado(s)`)
  openDetail(orderId)
}

function deleteFile(orderId, idx) {
  const orders=getOrders(); const oi=orders.findIndex(o=>o.id===orderId)
  if(oi<0) return
  const [removed] = orders[oi].archivos.splice(idx,1)
  if (removed?.fileId) deleteStoredFile(removed.fileId)
  saveOrders(orders); toast('Archivo eliminado')
}

function addQuoteItem() {
  quoteItemCount++
  const i=quoteItemCount
  const row=document.createElement('div')
  row.className='quote-item-row'
  row.id='qrow-'+i
  row.style.marginBottom='6px'
  row.innerHTML=`
    <input class="input" style="font-size:12px" placeholder="Descripción del ítem" oninput="recalcQuote()"/>
    <input class="input" style="font-size:12px" type="number" min="0" value="1" oninput="recalcQuote()"/>
    <input class="input" style="font-size:12px" type="number" min="0" step="0.01" placeholder="0.00" oninput="recalcQuote()"/>
    <div class="money text-blue" id="qsub-${i}" style="padding:8px 4px;font-size:13px">$ 0,00</div>
    <button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px" onclick="document.getElementById('qrow-${i}').remove();recalcQuote()">×</button>`
  document.getElementById('quote-items').appendChild(row)
}

function recalcQuote() {
  let total=0
  document.querySelectorAll('[id^="qrow-"]').forEach((row,idx)=>{
    const inputs=row.querySelectorAll('input')
    const sub=(Number(inputs[1]?.value)||0)*(Number(inputs[2]?.value)||0)
    total+=sub
    const subEl=document.getElementById('qsub-'+(idx+1))
    if(subEl) subEl.textContent=fmtUSD(sub)
  })
  document.getElementById('q-total-display').textContent=fmtUSD(total)
}

function saveQuote(estado) {
  const clientId=document.getElementById('q-client').value
  if(!clientId) return alert('Seleccioná un cliente')
  const items=Array.from(document.querySelectorAll('[id^="qrow-"]')).map(row=>{
    const inputs=row.querySelectorAll('input')
    return { desc:inputs[0].value, qty:Number(inputs[1].value)||0, price:Number(inputs[2].value)||0 }
  }).filter(it=>it.desc||it.qty||it.price)
  const total=items.reduce((s,it)=>s+(it.qty||0)*(it.price||0),0)
  const quotes=getQuotes()
  const year=new Date().getFullYear()
  const code='PRS-'+year+'-'+String(quotes.filter(q=>q.companyId===currentCompanyId).length+1).padStart(3,'0')
  quotes.push({ id:uid(), companyId:currentCompanyId, code, clientId, estado,
    fecha:document.getElementById('q-fecha').value,
    validez:document.getElementById('q-validez').value,
    moneda:document.getElementById('q-moneda').value,
    condPago:document.getElementById('q-cond-pago').value,
    notas:document.getElementById('q-notas').value,
    items, total, pagos:[],
    createdAt:new Date().toISOString().slice(0,10)
  })
  saveQuotes(quotes); closeModal('modal-quote'); toast('Presupuesto guardado'); renderPage()
}

function supplierCard(s, orders, folders) {
  const init=(s.nombre||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()
  const sOrders=orders.filter(o=>o.proveedor===s.nombre)
  const sFOB=sOrders.reduce((sum,o)=>sum+(Number(o.fob_total)||0),0)
  const comments=s.comments||[]
  const lastC=comments.length?comments[comments.length-1]:null
  const lastTxt=lastC?(lastC.txt||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''
  const folderOpts=folders.map(f=>`<option value="${f.id}" ${s.folderId===f.id?'selected':''}>${f.nombre}</option>`).join('')
  return `<div class="card entity-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div class="entity-avatar" style="background:var(--purple-bg);color:var(--purple-t)">${init}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14px;line-height:1.2">${s.nombre}</div>
        ${s.apodo?`<div style="font-size:12px;color:var(--blue-t);font-weight:600;margin-top:1px">${s.apodo}</div>`:''}
        <div style="font-size:11px;color:var(--text3);margin-top:1px">FOB: ${s.ciudad||'—'}</div>
      </div>
      <button class="btn btn-ghost btn-xs" onclick="editSupplier('${s.id}')" title="Editar">✏️</button>
    </div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:3px">Cat: ${s.cat||'—'} · Lead time: ${s.leadtime?s.leadtime+'d':'—'}</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:8px">${sOrders.length} órdenes · ${fmtUSD(sFOB)}</div>
    ${lastC?`<div style="font-size:11px;color:var(--text2);background:var(--surface2);border-radius:6px;padding:6px 8px;margin-bottom:8px">💬 ${lastTxt}${comments.length>1?` <span style="opacity:.6">(+${comments.length-1})</span>`:''}</div>`:''}
    <select class="select" style="padding:4px 6px;font-size:11px" onchange="assignSupplierFolder('${s.id}',this.value)" title="Mover a carpeta">
      <option value="">📁 Sin carpeta</option>
      ${folderOpts}
    </select>
  </div>`
}

function renderSuppliers() {
  const supps=getSuppliers()
  const orders=getOrders()
  const folders=getSupplierFolders()
  const unfiled=supps.filter(s=>!s.folderId || !folders.some(f=>f.id===s.folderId))
  let html=`<div style="display:flex;gap:8px;margin-bottom:16px">
    <button class="btn btn-ghost btn-sm" onclick="openModal('modal-sfolder')">📁 + Carpeta de producto</button>
  </div>`
  folders.forEach(f=>{
    const list=supps.filter(s=>s.folderId===f.id)
    html+=`<div style="margin-bottom:22px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span class="section-title">📁 ${f.nombre} <span style="color:var(--text3);font-weight:500">(${list.length})</span></span>
        ${f.desc?`<span style="font-size:11px;color:var(--text3)">${f.desc}</span>`:''}

      <div class="entity-grid">

  })
  html+=`<div style="margin-bottom:12px">
    <div class="section-title mb12">${folders.length?`Sin carpeta (${unfiled.length})`:'Proveedores'}</div>
    <div class="entity-grid">

    </div>

  return html

function renderSCommentsList(comments) {
  const el = document.getElementById('s-comments-list')
  if (!el) return
  const c = comments || []
  if (!c.length) { el.innerHTML = '<div style="font-size:11px;color:var(--text3)">Sin notas todavía.</div>'; return }
  el.innerHTML = c.slice().reverse().map(x=>{

const CALC_DEFAULTS = {
  di_pct: 35, te_pct: 3, te_cap: 500,
  iva_pct: 21, iva_adicional_pct: 20,
  ganancias_pct: 6, iibb_pct: 3,
  seguro_pct: 0.45, gasto_banco_ext_pct: 0.50,
  despachante: 450, thc_bl: 280, almacenaje: 125,
  swift_local: 70, flete_interno: 280,
  fee_fijo_a: 900, fee_pct_a: 4,
  fee_fijo_b: 550, fee_pct_b: 3,
  iva_fee_pct: 21,
}
// Las tasas guardadas pisan los valores por defecto; las que falten (o no sean números) usan el default.
function getCalcConfig() {
  const saved = DB.get('calc_config') || {}
  const cfg = { ...CALC_DEFAULTS }
  for (const [k, v] of Object.entries(saved)) { const n = Number(v); if (v !== '' && v !== null && Number.isFinite(n)) cfg[k] = n }
  return cfg
}
function saveCalcConfig(cfg) { DB.set('calc_config', cfg) }
function getCalcSaves() { return DB.get('calc_saves2') || [] }
function saveCalcSaves(a) { DB.set('calc_saves2', a) }

// Core landed cost math — takes total FOB and shared costs
function computeLanded(fob, flete, cfg, modulo, paraMi = false, descuento = 0, bienUso = false) {
  const fobNeto = Math.max(0, fob - (descuento||0))
  const seguro = (fobNeto + flete) * (cfg.seguro_pct / 100)
  const cif = fobNeto + flete + seguro
  const banco_ext = fobNeto * (cfg.gasto_banco_ext_pct / 100)
  const di = cif * (cfg.di_pct / 100)
  const te = Math.min(cif * (cfg.te_pct / 100), cfg.te_cap)
  const base_amp = cif + di + te
  const iva = base_amp * (cfg.iva_pct / 100)
  // Bien de uso: exento de percepción de IVA adicional, percepción de Ganancias e IIBB
  const iva_ad = bienUso ? 0 : base_amp * (cfg.iva_adicional_pct / 100)
  const ganancias = bienUso ? 0 : base_amp * (cfg.ganancias_pct / 100)
  const iibb = bienUso ? 0 : base_amp * (cfg.iibb_pct / 100)
  const total_trib = di + te + iva + iva_ad + ganancias + iibb
  const total_locales = cfg.despachante + cfg.thc_bl + cfg.almacenaje + cfg.swift_local + cfg.flete_interno + banco_ext
  const fee_fijo = paraMi ? 0 : (modulo === 'A' ? cfg.fee_fijo_a : cfg.fee_fijo_b)
  const fee_pct_val = paraMi ? 0 : fobNeto * ((modulo === 'A' ? cfg.fee_pct_a : cfg.fee_pct_b) / 100)
  const total_fee = fee_fijo + fee_pct_val
  const iva_fee = paraMi ? 0 : total_fee * (cfg.iva_fee_pct / 100)
  const landed = cif + total_trib + total_locales + total_fee + iva_fee
  return { fobNeto, descuento: descuento||0, seguro, cif, banco_ext, di, te, base_amp, iva, iva_ad, ganancias, iibb,
           total_trib, total_locales, fee_fijo, fee_pct_val, total_fee, iva_fee, landed, bienUso }
}

// Landed cost producto por producto.
// - Cada producto puede tener su propio derecho (di_pct) e IVA (iva_pct) según su NCM;
//   si no tiene, usa las tasas generales.
// - El flete se reparte por volumen cuando todos los productos tienen CBM; si no, por FOB.
// - IVA, IVA adicional, Ganancias, IIBB e IVA del fee son créditos fiscales: se pagan,
//   pero un responsable inscripto los recupera. costoReal = landed - créditos.
function pctOr(v, def) { const n = parseFloat(v); return Number.isFinite(n) ? n : def }

function computeLandedProducts(products, flete, cfg, modulo, paraMi = false, descuento = 0, bienUso = false) {
  const rows = products.map(p => ({ p, fob: (Number(p.qty)||0) * (Number(p.fob)||0), cbm: (Number(p.qty)||0) * (Number(p.cbm)||0) }))
  const fobTotal = rows.reduce((s, r) => s + r.fob, 0)
  const desc = Math.min(Number(descuento)||0, fobTotal)
  const byVolume = rows.length > 0 && rows.every(r => r.cbm > 0)
  const cbmTotal = rows.reduce((s, r) => s + r.cbm, 0)
  flete = Number(flete) || 0

  rows.forEach(r => {
    r.share = fobTotal ? r.fob / fobTotal : 0
    r.fobNeto = r.fob - desc * r.share
    r.flete = flete * (byVolume ? r.cbm / cbmTotal : r.share)
    r.seguro = (r.fobNeto + r.flete) * (cfg.seguro_pct / 100)
    r.cif = r.fobNeto + r.flete + r.seguro
    r.diPct = pctOr(r.p.di_pct, cfg.di_pct)
    r.ivaPct = pctOr(r.p.iva_pct, cfg.iva_pct)
  })
  const cif = rows.reduce((s, r) => s + r.cif, 0)
  const teTotal = Math.min(cif * (cfg.te_pct / 100), cfg.te_cap)
  rows.forEach(r => {
    r.te = cif ? teTotal * r.cif / cif : 0
    r.di = r.cif * r.diPct / 100
    r.base = r.cif + r.di + r.te
    r.iva = r.base * r.ivaPct / 100
    // Con IVA reducido (10,5%) la percepción de IVA adicional es la mitad.
    const ivaAdPct = r.ivaPct === 10.5 ? cfg.iva_adicional_pct / 2 : cfg.iva_adicional_pct
    r.iva_ad = bienUso ? 0 : r.base * ivaAdPct / 100
    r.ganancias = bienUso ? 0 : r.base * cfg.ganancias_pct / 100
    r.iibb = bienUso ? 0 : r.base * cfg.iibb_pct / 100
  })
  const sum = k => rows.reduce((s, r) => s + r[k], 0)
  const fobNeto = fobTotal - desc
  const di = sum('di'), te = sum('te'), iva = sum('iva'), iva_ad = sum('iva_ad'), ganancias = sum('ganancias'), iibb = sum('iibb')
  const total_trib = di + te + iva + iva_ad + ganancias + iibb
  const banco_ext = fobNeto * (cfg.gasto_banco_ext_pct / 100)
  const total_locales = cfg.despachante + cfg.thc_bl + cfg.almacenaje + cfg.swift_local + cfg.flete_interno + banco_ext
  const fee_fijo = paraMi ? 0 : (modulo === 'A' ? cfg.fee_fijo_a : cfg.fee_fijo_b)
  const fee_pct_val = paraMi ? 0 : fobNeto * ((modulo === 'A' ? cfg.fee_pct_a : cfg.fee_pct_b) / 100)
  const total_fee = fee_fijo + fee_pct_val
  const iva_fee = paraMi ? 0 : total_fee * (cfg.iva_fee_pct / 100)
  const landed = cif + total_trib + total_locales + total_fee + iva_fee
  const creditos = iva + iva_ad + ganancias + iibb + iva_fee
  const mixedRates = new Set(rows.map(r => r.diPct + '/' + r.ivaPct)).size > 1

  const items = rows.map(r => {
    const overhead = r.share * (total_locales + total_fee + iva_fee)
    const landedTotal = r.cif + r.di + r.te + r.iva + r.iva_ad + r.ganancias + r.iibb + overhead
    const creditosI = r.iva + r.iva_ad + r.ganancias + r.iibb + r.share * iva_fee
    const qty = Number(r.p.qty) || 0
    return { ...r.p, pFob: r.fob, flete_asignado: r.flete, di_aplicado: r.diPct, iva_aplicado: r.ivaPct,
      landedTotal, landedUnit: qty ? landedTotal / qty : 0, realUnit: qty ? (landedTotal - creditosI) / qty : 0,
      precioVenta: qty ? landedTotal / qty : 0, multiplo: r.fob ? landedTotal / r.fob : 0 }
  })
  const totals = { fobNeto, descuento: desc, seguro: sum('seguro'), cif, banco_ext, di, te, base_amp: sum('base'),
    iva, iva_ad, ganancias, iibb, total_trib, total_locales, fee_fijo, fee_pct_val, total_fee, iva_fee, landed, bienUso,
    creditos, costoReal: landed - creditos, fleteReparto: byVolume ? 'volumen' : 'fob', mixedRates }
  return { totals, items }
}

// Compatibilidad: devuelve la lista de productos con .totals adjunto.
function calcProductLanded(products, flete, cfg, modulo, paraMi = false, descuento = 0, bienUso = false) {
  const { totals, items } = computeLandedProducts(products, flete, cfg, modulo, paraMi, descuento, bienUso)
  items.totals = totals
  return items
}

function addCalcProd(existing) {
  calcProdCount++
  const id = existing?.id || ('cp' + Date.now().toString(36) + calcProdCount)
  const p = existing || { id, desc: '', qty: 0, fob: 0 }
  if (!existing) calcProds.push(p)
  const cfg = getCalcConfig()

  const row = document.createElement('div')
  row.id = 'crow-' + id
  row.style.cssText = 'margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border)'
  row.innerHTML = `
    <div style="display:grid;grid-template-columns:2fr 80px 90px 110px 110px 32px;gap:6px;align-items:center">
      <input class="input" style="font-size:12px" list="calc-catalog" value="${esc(p.desc||'')}" placeholder="Producto (escribí o elegí del catálogo)" oninput="updateCalcProd('${id}','desc',this.value)" onchange="applyCatalogToCalcProd('${id}',this.value)"/>
      <input class="input mono" style="font-size:12px" type="number" min="0" value="${p.qty||''}" placeholder="0" oninput="updateCalcProd('${id}','qty',this.value)"/>
      <input class="input mono" style="font-size:12px" type="number" min="0" step="0.01" value="${p.fob||''}" placeholder="0.00" oninput="updateCalcProd('${id}','fob',this.value)"/>
      <div class="money text-red" style="font-size:12px;padding:0 4px;line-height:1.25" id="cr_lu_${id}">—</div>
      <div class="money text-blue" style="font-size:12px;padding:0 4px" id="cr_pv_${id}">—</div>
      <button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0;display:flex;align-items:center;justify-content:center" onclick="removeCalcProd('${id}')" title="Quitar">×</button>
    </div>
    <div style="display:grid;grid-template-columns:110px 70px 80px 80px 80px 1fr;gap:6px;align-items:center;margin-top:5px">
      <input class="input mono" style="font-size:11px;padding:4px 6px" value="${esc(p.ncm||'')}" placeholder="NCM" title="Posición arancelaria" oninput="updateCalcProd('${id}','ncm',this.value)"/>
      <input class="input mono" style="font-size:11px;padding:4px 6px" type="number" min="0" step="0.1" value="${p.di_pct ?? ''}" placeholder="DI ${cfg.di_pct}%" title="Derecho de importación %" oninput="updateCalcProd('${id}','di_pct',this.value)"/>
      <select class="select" style="font-size:11px;padding:4px 6px" title="IVA %" onchange="updateCalcProd('${id}','iva_pct',this.value)">
        ${[['', 'IVA ' + cfg.iva_pct + '%'], ['21', 'IVA 21%'], ['10.5', 'IVA 10,5%'], ['0', 'IVA 0%']].map(([val, l]) => `<option value="${val}" ${String(p.iva_pct ?? '') === val ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <input class="input mono" style="font-size:11px;padding:4px 6px" type="number" min="0" step="0.001" value="${p.cbm||''}" placeholder="m³/un." title="Volumen por unidad (m³)" oninput="updateCalcProd('${id}','cbm',this.value)"/>
      <input class="input mono" style="font-size:11px;padding:4px 6px" type="number" min="0" step="0.01" value="${p.kg||''}" placeholder="kg/un." title="Peso por unidad (kg)" oninput="updateCalcProd('${id}','kg',this.value)"/>
      <div style="display:flex;gap:6px;align-items:center;justify-content:flex-end">

      </div>

  `

  recalcAll()

const CALC_NUM_FIELDS = ['qty', 'fob', 'cbm', 'kg']
const CALC_PCT_FIELDS = ['di_pct', 'iva_pct']   // vacío = usa la tasa general
function updateCalcProd(id, field, val) {
  const p = calcProds.find(x => x.id === id)
  if (p) {
    if (CALC_NUM_FIELDS.includes(field)) p[field] = parseFloat(val) || 0
    else if (CALC_PCT_FIELDS.includes(field)) { const n = parseFloat(val); if (Number.isFinite(n)) p[field] = n; else delete p[field] }
    else p[field] = val
    DB.set('calc_prods_draft', calcProds)
  }
  recalcAll()
}

// Al elegir un producto del catálogo, completa sus datos en la fila.
function applyCatalogToCalcProd(id, name) {
  const prod = getProducts().find(x => x.nombre === name)
  const p = calcProds.find(x => x.id === id)
  if (!prod || !p) return
  Object.assign(p, { desc: prod.nombre, productId: prod.id, ncm: prod.ncm || '', cbm: Number(prod.cbm) || 0, kg: Number(prod.kg) || 0 })
  if (!p.fob && prod.fob_ref) p.fob = Number(prod.fob_ref) || 0
  ;['di_pct', 'iva_pct'].forEach(k => { const n = parseFloat(prod[k]); if (Number.isFinite(n)) p[k] = n; else delete p[k] })
  DB.set('calc_prods_draft', calcProds)
  initCalcPage()
  toast('Datos de "' + prod.nombre + '" cargados')
}

function saveCalcProdToCatalog(id) {
  const p = calcProds.find(x => x.id === id)
  if (!p || !p.desc) { toast('Poné un nombre de producto primero'); return }
  const products = getProducts()
  const existing = products.find(x => x.id === p.productId) || products.find(x => x.nombre.toLowerCase() === p.desc.trim().toLowerCase())
  const data = { nombre: p.desc.trim(), ncm: p.ncm || '', di_pct: p.di_pct ?? '', iva_pct: p.iva_pct ?? '', cbm: p.cbm || '', kg: p.kg || '', fob_ref: p.fob || '' }
  if (existing) Object.assign(existing, data)
  else products.push({ id: uid(), ...data })
  saveProducts(products)
  p.productId = existing?.id || products[products.length - 1].id
  DB.set('calc_prods_draft', calcProds)
  renderCalcCatalogList()
  toast(existing ? 'Producto actualizado en el catálogo ✓' : 'Producto agregado al catálogo ✓')
}

function renderCalcCatalogList() {
  const dl = document.getElementById('calc-catalog')
  if (dl) dl.innerHTML = getProducts().map(x => `<option value="${esc(x.nombre)}">${esc(x.ncm || '')}</option>`).join('')
}

function removeCalcProd(id) {
  calcProds = calcProds.filter(p => p.id !== id)
  document.getElementById('crow-' + id)?.remove()
  DB.set('calc_prods_draft', calcProds)
  recalcAll()
}

function resetCalc2() {
  calcProds = []
  calcProdCount = 0
  DB.set('calc_prods_draft', [])
  const rows = document.getElementById('calc-prod-rows')
  if (rows) rows.innerHTML = ''
  document.getElementById('calc-breakdown').style.display = 'none'; const ce0 = document.getElementById('calc-empty'); if (ce0) ce0.style.display = ''
  document.getElementById('calc-prod-totals').style.display = 'none'
  const flete = document.getElementById('c2_flete'); if (flete) flete.value = ''
  const desc = document.getElementById('c2_descuento'); if (desc) desc.value = ''
  addCalcProd()
}

let calcMode = 'cliente'
function setCalcMode(mode) {
  calcMode = mode
  const bc = document.getElementById('btn-para-cliente')
  const bm = document.getElementById('btn-para-mi')
  const mg = document.getElementById('modulo-group')
  const cl = document.getElementById('col-venta-label')
  if (bc && bm) {
    if (mode === 'cliente') {
      bc.className = 'btn btn-primary btn-sm'; bm.className = 'btn btn-ghost btn-sm'
      if (mg) mg.style.display = ''; if (cl) { cl.textContent = 'Precio/un.'; cl.style.color = 'var(--blue-t)' }
    } else {
      bc.className = 'btn btn-ghost btn-sm'; bm.className = 'btn btn-primary btn-sm'
      if (mg) mg.style.display = 'none'; if (cl) { cl.textContent = 'Costo/un.'; cl.style.color = 'var(--green-t)' }
    }
  }
  recalcAll()
}

function recalcAll() {
  const cfg = getCalcConfig()
  const modulo = document.getElementById('c2_modulo')?.value || 'A'
  const flete = parseFloat(document.getElementById('c2_flete')?.value) || 0
  const descuento = parseFloat(document.getElementById('c2_descuento')?.value) || 0
  const paraMi = (typeof calcMode !== 'undefined' && calcMode === 'mi')
  const bienUso = document.getElementById('c2_bienuso')?.checked || false

  const validProds = calcProds.filter(p => (p.qty > 0) && (p.fob > 0))
  if (!validProds.length) {
    document.getElementById('calc-breakdown').style.display = 'none'; const ce1 = document.getElementById('calc-empty'); if (ce1) ce1.style.display = ''
    document.getElementById('calc-prod-totals').style.display = 'none'
    return
  }

  const results = calcProductLanded(validProds, flete, cfg, modulo, paraMi, descuento, bienUso)
  const fobTotal = validProds.reduce((s, p) => s + p.qty * p.fob, 0)
  const totals = results.totals

  // Update per-product rows
  results.forEach(r => {
    const lu = document.getElementById('cr_lu_' + r.id)
    const pv = document.getElementById('cr_pv_' + r.id)
    if (lu) lu.innerHTML = fmtUSD(r.landedUnit) + `<div style="font-size:10px;color:var(--green-t);font-weight:600" title="Sin créditos fiscales recuperables">real ${fmtUSD(r.realUnit)}</div>`
    const info = document.getElementById('cr_info_' + r.id)
    if (info) info.textContent = `DI ${r.di_aplicado}% · IVA ${r.iva_aplicado}% · flete ${fmtUSD(r.flete_asignado)}`
    if (pv) pv.textContent = fmtUSD(r.precioVenta)
  })

  // Totals row
  const totalQty = validProds.reduce((s, p) => s + p.qty, 0)
  const totalVenta = results.reduce((s, r) => s + r.precioVenta * (r.qty||0), 0)
  document.getElementById('calc-prod-totals').style.display = 'block'
  document.getElementById('ct_qty').textContent = totalQty.toLocaleString('es-AR')
  document.getElementById('ct_fob').textContent = fmtUSD(fobTotal)
  document.getElementById('ct_landed').textContent = fmtUSD(totals.landed)
  document.getElementById('ct_venta').textContent = fmtUSD(totalVenta)

  // Breakdown card
  document.getElementById('calc-breakdown').style.display = 'block'; const ce2 = document.getElementById('calc-empty'); if (ce2) ce2.style.display = 'none'
  document.getElementById('cb_fob').textContent = fmtUSD(fobTotal)
  document.getElementById('cb_landed').textContent = fmtUSD(totals.landed)
  document.getElementById('cb_venta').textContent = fmtUSD(totalVenta)
  document.getElementById('cb_multi').textContent = fobTotal ? (totals.landed / fobTotal).toFixed(2) + 'x' : '—'

  const rows = [
    { label: 'FOB mercadería', val: fobTotal, color: 'var(--blue)' },
    ...(descuento > 0 ? [{ label: 'Descuento sobre FOB', val: -descuento, color: 'var(--green)' }] : []),
    { label: totals.mixedRates ? 'DI (según cada NCM)' : `DI (${results[0]?.di_aplicado ?? cfg.di_pct}%)`, val: totals.di, color: '#DC2626' },
    { label: `TE (${cfg.te_pct}%)`, val: totals.te, color: '#B91C1C' },
    { label: totals.mixedRates ? 'IVA import. (según cada NCM)' : `IVA import. (${results[0]?.iva_aplicado ?? cfg.iva_pct}%)`, val: totals.iva, color: '#EF4444' },
    { label: `IVA Adicional (${cfg.iva_adicional_pct}%)`, val: totals.iva_ad, color: '#F87171' },
    { label: `Ganancias (${cfg.ganancias_pct}%)`, val: totals.ganancias, color: '#FCA5A5' },
    { label: `IIBB (${cfg.iibb_pct}%)`, val: totals.iibb, color: '#FECACA' },
    { label: 'Gastos locales y banco', val: totals.total_locales, color: 'var(--amber)' },
    { label: 'Fee + IVA fee', val: totals.total_fee + totals.iva_fee, color: 'var(--purple)' },
  ]
  document.getElementById('cb_rows').innerHTML = rows.map(r => `
    <div style="display:flex;justify-content:space-between;padding:4px 6px;font-size:12px;border-bottom:1px solid var(--border)">
      <span style="color:var(--text2);display:flex;align-items:center;gap:6px">
        <span style="width:8px;height:8px;border-radius:2px;background:${r.color};display:inline-block;flex-shrink:0"></span>${r.label}
      </span>
      <span class="money" style="${r.val<0?'color:var(--green-t)':''}">${r.val<0?'-':''}${fmtUSD(Math.abs(r.val))}</span>
    </div>`).join('') + `
    <div style="margin-top:10px;padding:10px;border-radius:var(--r);background:var(--surface2);font-size:12px;line-height:1.7">
      <div style="display:flex;justify-content:space-between"><span><b>Plata que necesitás</b> (todo lo que se paga)</span><span class="money">${fmtUSD(totals.landed)}</span></div>
      <div style="display:flex;justify-content:space-between;color:var(--green-t)"><span>− Créditos fiscales que recuperás <span title="IVA, IVA adicional, percepciones de Ganancias e IIBB e IVA del fee. Se recuperan si sos responsable inscripto." style="cursor:help">ⓘ</span></span><span class="money">−${fmtUSD(totals.creditos)}</span></div>

// ── SAVE AS QUOTE ──
function openSaveAsQuote() {
  const validProds = calcProds.filter(p => p.qty > 0 && p.fob > 0)
  if (!validProds.length) { alert('Agregá al menos un producto con cantidad y FOB para crear un presupuesto.'); return }
  const clients = getClients().filter(c => c.companyId === currentCompanyId)
  if (!clients.length) { alert('Primero creá un cliente en la sección Clientes.'); return }
  document.getElementById('sq-client').innerHTML = clients.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')
  document.getElementById('sq-fecha').value = new Date().toISOString().slice(0, 10)
  const validez = new Date(); validez.setDate(validez.getDate() + 5)
  document.getElementById('sq-validez').value = validez.toISOString().slice(0, 10)
  document.getElementById('sq-cond').value = ''
  document.getElementById('sq-notas').value = ''
  openModal('modal-save-quote')
}

function saveAsQuote(estado) {
  const clientId = document.getElementById('sq-client').value
  if (!clientId) { alert('Seleccioná un cliente.'); return }

  const cfg = getCalcConfig()
  const modulo = document.getElementById('c2_modulo')?.value || 'A'
  const flete = parseFloat(document.getElementById('c2_flete')?.value) || 0
  const descuento = parseFloat(document.getElementById('c2_descuento')?.value) || 0
  const paraMi = (typeof calcMode !== 'undefined' && calcMode === 'mi')
  const bienUso = document.getElementById('c2_bienuso')?.checked || false
  const validProds = calcProds.filter(p => p.qty > 0 && p.fob > 0)
  const results = calcProductLanded(validProds, flete, cfg, modulo, paraMi, descuento, bienUso)
  const fobTotal = validProds.reduce((s, p) => s + p.qty * p.fob, 0)
  const totals = results.totals
  const totalVenta = results.reduce((s, r) => s + r.precioVenta * (r.qty || 0), 0)

  const quotes = getQuotes()
  const year = new Date().getFullYear()
  const code = 'PRS-' + year + '-' + String(quotes.filter(q => q.companyId === currentCompanyId).length + 1).padStart(3, '0')

  const newQuote = {
    id: uid(), companyId: currentCompanyId, clientId, code, estado,
    fecha: document.getElementById('sq-fecha').value,
    validez: document.getElementById('sq-validez').value,
    condPago: document.getElementById('sq-cond').value,
    notas: document.getElementById('sq-notas').value,
    moneda: 'USD',
    total: totalVenta,
    fobTotal, flete, modulo, descuento, bienUso, _paraMi: paraMi,
    landedTotal: totals.landed,
    multiplo: fobTotal ? totals.landed / fobTotal : 0,
    items: results.map(r => ({
      desc: r.desc, qty: r.qty, fob: r.fob,
      ncm: r.ncm || '', di_pct: r.di_aplicado, iva_pct: r.iva_aplicado, cbm: r.cbm || 0, kg: r.kg || 0, productId: r.productId || null, realUnit: r.realUnit,
      markup: r.markup, landedUnit: r.landedUnit,
      precioVenta: r.precioVenta,
      total: r.precioVenta * (r.qty || 0)
    })),
    costoDetalle: {
      di: totals.di, te: totals.te, iva: totals.iva, iva_ad: totals.iva_ad,
      ganancias: totals.ganancias, iibb: totals.iibb,
      total_trib: totals.total_trib, total_locales: totals.total_locales,
      total_fee: totals.total_fee, iva_fee: totals.iva_fee,
      descuento, fobNeto: totals.fobNeto, bienUso,
      creditos: totals.creditos, costoReal: totals.costoReal, seguro: totals.seguro, porProducto: true,
    },
    pagos: [],
    createdAt: new Date().toISOString().slice(0, 10),
  }

  quotes.push(newQuote)
  saveQuotes(quotes)
  closeModal('modal-save-quote')
  toast('Presupuesto creado ✓')
  nav('quotes')
}

        ${saldoQ>0?`<div style="font-size:11px;color:var(--amber-t)">Saldo: ${fmtUSD(saldoQ)}</div>`:''}

    ${q.items?.length?`<div style="font-size:12px;color:var(--text2);margin-bottom:8px">${q.items.length} producto${q.items.length!==1?'s':''}: ${q.items.slice(0,3).map(i=>i.desc).filter(Boolean).join(', ')}${q.items.length>3?'...':''}</div>`:''}

      ${q.estado!=='rechazado'?`<button class="btn btn-danger btn-xs" onclick="changeQStatus('${q.id}','rechazado')">✗ Rechazar</button>`:''}
      ${q.estado!=='enviado'?`<button class="btn btn-xs" onclick="changeQStatus('${q.id}','enviado')">Marcar enviado</button>`:''}

  const COLORS = { info:['var(--blue-t)','var(--blue-bg)'], warn:['var(--amber-t)','var(--amber-bg)'], urgent:['var(--red-t)','var(--red-bg)'], ok:['var(--green-t)','var(--green-bg)'] }
  const [color, bg] = COLORS[tipo] || COLORS.info
  const alerts = getAlerts()
  alerts.unshift({ id:uid(), companyId:currentCompanyId, text:texto, tipo, color, bg, fecha:document.getElementById('al-fecha').value, orderId:document.getElementById('al-order')?.value||'', createdAt:new Date().toISOString().slice(0,10) })
  saveAlerts(alerts)
  document.getElementById('modal-alert').classList.remove('open')
  toast('Alerta guardada'); renderPage()
}

let _calYear = null, _calMonth = null

function renderCalendar() {
  const today = new Date()
  if (_calYear===null) _calYear=today.getFullYear()
  if (_calMonth===null) _calMonth=today.getMonth()
  const year=_calYear, month=_calMonth
  const firstDay=new Date(year,month,1), lastDay=new Date(year,month+1,0)
  const startDow=firstDay.getDay()===0?6:firstDay.getDay()-1
  const orders=ordersByCompany(), alerts=getAlerts().filter(a=>a.companyId===currentCompanyId)
  const events={}
  const addEv=(d,ev)=>{if(!events[d])events[d]=[];events[d].push(ev)}
  orders.filter(o=>o.eta&&['transito','aduana'].includes(o.estado)).forEach(o=>addEv(o.eta.slice(0,10),{label:`📦 ${o.code} ETA`,color:'var(--blue)',orderId:o.id}))
  orders.filter(o=>o.fin_prod&&o.estado==='produccion').forEach(o=>addEv(o.fin_prod.slice(0,10),{label:`🏭 ${o.code} Fin prod.`,color:'var(--amber)',orderId:o.id}))
  alerts.filter(a=>a.fecha).forEach(a=>{const o=a.orderId?orders.find(x=>x.id===a.orderId):null;addEv(a.fecha,{label:`${a.tipo==='urgent'?'🔴':a.tipo==='warn'?'⚠️':a.tipo==='ok'?'✅':'ℹ️'} ${a.text}${o?' · '+o.code:''}`,color:a.color||'var(--text2)',alertId:a.id,orderId:a.orderId})})
  const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
  const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom']
  let cells=''
  for(let i=0;i<startDow;i++) cells+=`<div style="min-height:90px;background:var(--surface2);border-radius:var(--r);opacity:.3"></div>`
  for(let d=1;d<=lastDay.getDate();d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const isToday=ds===today.toISOString().slice(0,10)
    const dayEvs=events[ds]||[]
    cells+=`<div style="min-height:90px;background:var(--surface);border-radius:var(--r);border:1px solid ${isToday?'var(--blue)':'var(--border)'};padding:6px">
      <div style="font-size:12px;font-weight:${isToday?'700':'500'};color:${isToday?'var(--blue-t)':'var(--text2)'};margin-bottom:4px;font-family:var(--mono)">${d}</div>
      ${dayEvs.map(ev=>`<div style="font-size:10px;font-weight:600;color:${ev.color};background:${ev.color}18;border-radius:3px;padding:2px 5px;margin-bottom:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="${ev.orderId?`openDetail('${ev.orderId}')`:''}" title="${ev.label}">${ev.label}</div>`).join('')}
      <div style="margin-top:4px"><button style="font-size:9px;background:none;border:none;color:var(--text3);cursor:pointer;padding:0" onclick="openAlertModal();setTimeout(()=>{const f=document.getElementById('al-fecha');if(f)f.value='${ds}'},50)">+ alerta</button></div>
    </div>`
  }
  const upcoming=[...alerts.filter(a=>a.fecha&&a.fecha>=today.toISOString().slice(0,10))].sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,8)
  return `
  <style>.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}</style>
  <div style="display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start">
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <button class="btn btn-ghost btn-sm" onclick="calPrevMonth()">←</button>
        <span style="font-size:16px;font-weight:700;flex:1;text-align:center">${MONTHS[month]} ${year}</span>
        <button class="btn btn-ghost btn-sm" onclick="calNextMonth()">→</button>
        <button class="btn btn-sm" onclick="calToday()">Hoy</button>
      </div>
      <div class="cal-grid" style="margin-bottom:5px">${DAYS.map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;font-family:var(--mono)">${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div>
      <div class="card mb12">
        <div class="flex-between mb10"><span class="section-title">Próximas alertas</span><button class="btn btn-primary btn-sm" onclick="openAlertModal()">+ Nueva</button></div>
        ${upcoming.length===0?'<p class="text-muted" style="font-size:12px">Sin alertas próximas.</p>':upcoming.map(a=>{
          const o=a.orderId?orders.find(x=>x.id===a.orderId):null
          const daysLeft=Math.round((new Date(a.fecha+'T12:00:00')-today)/86400000)
          return `<div style="display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)">
            <div style="width:8px;height:8px;border-radius:50%;background:${a.color||'var(--text3)'};flex-shrink:0;margin-top:4px"></div>
            <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">${a.text}</div>
            ${o?`<div style="font-size:10px;color:var(--text3)">${o.code}</div>`:''}
            <div style="font-size:10px;color:var(--text3);font-family:var(--mono)">${fmtDate(a.fecha)} ${daysLeft===0?'· HOY':daysLeft<0?`· hace ${Math.abs(daysLeft)}d`:`· en ${daysLeft}d`}</div></div>
            <button class="btn btn-ghost btn-xs" style="color:var(--red-t)" onclick="deleteAlert('${a.id}');renderPage()">✕</button>
          </div>`}).join('')}
      </div>
      <div class="card">
        <div class="flex-between mb8"><span class="section-title">Leyenda</span><button class="btn btn-ghost btn-xs" onclick="openLegendEditor()">✏️</button></div>
        ${getCalendarLegend().map(item=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px;color:var(--text2)"><div style="width:8px;height:8px;border-radius:50%;background:${item.color};flex-shrink:0"></div>${item.label}</div>`).join('')}
      </div>
    </div>
  </div>`
}

function calPrevMonth(){_calMonth--;if(_calMonth<0){_calMonth=11;_calYear--}document.getElementById('content').innerHTML=renderCalendar()}
function calNextMonth(){_calMonth++;if(_calMonth>11){_calMonth=0;_calYear++}document.getElementById('content').innerHTML=renderCalendar()}
function calToday(){const t=new Date();_calYear=t.getFullYear();_calMonth=t.getMonth();document.getElementById('content').innerHTML=renderCalendar()}

function eqRecalc(){
  const cfg=getCalcConfig()
  const di_pct=parseFloat(document.getElementById('eq-di')?.value)||cfg.di_pct
  const te_pct=parseFloat(document.getElementById('eq-te')?.value)||cfg.te_pct
  const iva_pct=parseFloat(document.getElementById('eq-iva')?.value)||cfg.iva_pct
  const iva_ad_pct=parseFloat(document.getElementById('eq-iva-ad')?.value)||cfg.iva_adicional_pct
  const gan_pct=parseFloat(document.getElementById('eq-gan')?.value)||cfg.ganancias_pct
  const iibb_pct=parseFloat(document.getElementById('eq-iibb')?.value)||cfg.iibb_pct
  const flete=parseFloat(document.getElementById('eq-flete')?.value)||0
  const modulo=document.getElementById('eq-modulo-sel')?.value||document.getElementById('eq-modulo')?.value||'A'
  const paraMi=(document.getElementById('eq-modo')?.value||'cliente')==='mi'

  const fobTotal=Array.from(document.querySelectorAll('[id^="eqrow-"]')).reduce((s,row)=>{
    const inputs=row.querySelectorAll('input');return s+(Number(inputs[1]?.value)||0)*(Number(inputs[2]?.value)||0)},0)

  const overrideCfg={...cfg,di_pct,te_pct,iva_pct,iva_adicional_pct:iva_ad_pct,ganancias_pct:gan_pct,iibb_pct}
  const t=computeLanded(fobTotal,flete,overrideCfg,modulo,paraMi)

  const el=document.getElementById('eq-landed');if(el)el.value=t.landed.toFixed(2)
  const el2=document.getElementById('eq-total');if(el2)el2.value=t.landed.toFixed(2)
  toast('Recalculado: '+fmtUSD(t.landed))
}

  const items=Array.from(document.querySelectorAll('[id^="eqrow-"]')).map(row=>{
    const inputs=row.querySelectorAll('input')
    return{desc:inputs[0].value,qty:Number(inputs[1].value)||0,fob:Number(inputs[2].value)||0,total:(Number(inputs[1].value)||0)*(Number(inputs[2].value)||0)}
  }).filter(it=>it.desc||it.qty||it.fob)
  const fobTotal=items.reduce((s,it)=>s+(it.qty||0)*(it.fob||0),0)
  const landedTotal=parseFloat(document.getElementById('eq-landed')?.value)||0
  const total=parseFloat(document.getElementById('eq-total')?.value)||0

  // Recalculate costoDetalle with updated percentages
  const overrideCfg={...cfg,di_pct,te_pct,iva_pct,iva_adicional_pct:iva_ad_pct,ganancias_pct:gan_pct,iibb_pct}

  // Si el presupuesto se armó por producto (NCM), cada ítem conserva su derecho, IVA y volumen.
  const orig=quotes[idx].items||[]
  const merged=items.map((it,i)=>{
    const o=orig[i]&&orig[i].desc===it.desc?orig[i]:orig.find(x=>x.desc===it.desc)
    return o?{...it,ncm:o.ncm,di_pct:o.di_pct,iva_pct:o.iva_pct,cbm:o.cbm,kg:o.kg,productId:o.productId}:it
  })
  const porProducto=merged.some(it=>it.di_pct!==undefined||it.iva_pct!==undefined||Number(it.cbm)>0)
  const r=computeLandedProducts(merged,flete,overrideCfg,modulo,paraMi,0,!!quotes[idx].bienUso)
  const t=r.totals

  // Distribute landedUnit per product
  const itemsWithLanded=r.items.map(it=>{
    const {pFob,flete_asignado,di_aplicado,iva_aplicado,landedTotal,precioVenta,multiplo,...rest}=it
    return porProducto?{...rest,di_pct:di_aplicado,iva_pct:iva_aplicado}:{desc:it.desc,qty:it.qty,fob:it.fob,total:it.total,landedUnit:it.landedUnit}
  })

  quotes[idx]={...quotes[idx],
    clientId:document.getElementById('eq-client').value,
    estado:document.getElementById('eq-estado').value,
    fecha:document.getElementById('eq-fecha').value,
    validez:document.getElementById('eq-validez').value,
    condPago:document.getElementById('eq-cond').value,
    notas:document.getElementById('eq-notas').value,
    items:itemsWithLanded,fobTotal,flete,landedTotal:t.landed,total,modulo,_paraMi:paraMi,
    multiplo:fobTotal?t.landed/fobTotal:0,
    costoDetalle:{di:t.di,te:t.te,iva:t.iva,iva_ad:t.iva_ad,ganancias:t.ganancias,iibb:t.iibb,total_trib:t.total_trib,total_locales:t.total_locales,total_fee:t.total_fee,iva_fee:t.iva_fee,seguro:t.seguro,creditos:t.creditos,costoReal:t.costoReal,porProducto}
  }
  saveQuotes(quotes)

  // Auto-sync to linked order if exists
  if(quotes[idx].orderId){
    const orders=getOrders();const oi=orders.findIndex(o=>o.id===quotes[idx].orderId)
    if(oi>=0){
      orders[oi].fob_total=fobTotal
      orders[oi]._flete=flete
      orders[oi]._landedTotal=t.landed
      orders[oi]._costoDetalle=quotes[idx].costoDetalle
      orders[oi].productos=itemsWithLanded.map(it=>({desc:it.desc,qty:it.qty,price:it.fob}))
      saveOrders(orders)
      toast('Presupuesto y orden actualizados ✓')
    }
  } else {
    toast('Presupuesto actualizado ✓')
  }

  document.getElementById('modal-edit-quote').classList.remove('open')
  renderPage()
}

async function handleFileSelectCat(event,orderId,categoria){
  const file=event.target.files[0];if(!file)return
  if(file.size>FILE_MAX_BYTES){ toast('⚠️ El archivo supera los 10 MB'); return }
  const ext=file.name.split('.').pop().toLowerCase()
  const size=file.size>1024*1024?(file.size/1024/1024).toFixed(1)+'MB':Math.round(file.size/1024)+'KB'
  const order=getOrders().find(o=>o.id===orderId);if(!order)return
  toast('Subiendo '+file.name+'…')
  let fileId
  try {
    fileId = await storeFile(await readAsDataUrl(file), { companyId: order.companyId ?? null, orderId, nombre: file.name, ext, size })
  } catch(e) { console.error(e); saveError(e); return }
  const orders=getOrders();const idx=orders.findIndex(o=>o.id===orderId);if(idx<0)return
  if(!orders[idx].archivos)orders[idx].archivos=[]
  orders[idx].archivos.push({id:fileId,fileId,nombre:file.name,ext,size,tipo:ext,categoria,fecha:new Date().toISOString().slice(0,10)})
  saveOrders(orders);openDetail(orderId);toast('Archivo adjunto ✓')
}

/* ════════════════════════════════════
   FASE 2 — Utilidades comunes
════════════════════════════════════ */
function todayISO() { return new Date().toISOString().slice(0, 10) }
function addDaysISO(d, n) { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10) }
function daysBetween(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000) }
function quoteOf(o) { return o.quoteId ? getQuotes().find(q => q.id === o.quoteId) : null }
// "Para mí" (sin fee): guardado desde esta versión; en presupuestos viejos se deduce de que no tengan fee.
function quoteParaMi(q) {
  if (typeof q._paraMi === 'boolean') return q._paraMi
  const cd = q.costoDetalle || {}
  return cd.total_fee !== undefined && (Number(cd.total_fee) || 0) === 0 && (Number(cd.iva_fee) || 0) === 0
}

// Guarda el costo estimado de la orden antes de que se pise con los valores reales.
function snapshotEstimate(o) {
  if (o._estimado || o._valoresReales) return
  const q = quoteOf(o)
  const landed = Number(q?.landedTotal ?? o._landedTotal) || 0
  if (!landed) return
  o._estimado = { landed, flete: Number(q?.flete ?? o._flete) || 0, fob: Number(o.fob_total) || 0,
    costoDetalle: q?.costoDetalle || o._costoDetalle || null, fecha: todayISO(), origen: q?.code || 'orden' }
}

// Registra fechas clave cuando cambia una orden: ETA y fin de producción originales, y fecha de entrega.
function trackOrderChange(o, prevEstado) {
  if (o.eta && !o._eta_original) o._eta_original = o.eta
  if (o.fin_prod && !o._fin_prod_original) o._fin_prod_original = o.fin_prod
  if (o.estado === 'entregado' && prevEstado !== 'entregado' && !o.fecha_entrega) o.fecha_entrega = todayISO()
  snapshotEstimate(o)
}

// Una vez por carga: guarda estimados y ETA originales de las órdenes activas que todavía no los tienen.
function backfillTracking() {
  const orders = getOrders()
  let changed = false
  orders.forEach(o => {
    if (o.estado === 'entregado') return
    const before = JSON.stringify(o)
    trackOrderChange(o, o.estado)
    if (JSON.stringify(o) !== before) changed = true
  })
  if (changed) saveOrders(orders)
}

/* ════════════════════════════════════
   DOCUMENTOS POR ETAPA
   Un documento cuenta como recibido si hay un archivo adjunto en su categoría
   o si alguien lo marcó a mano ("lo tengo" / "no aplica").
════════════════════════════════════ */
const DOC_REQS = [
  { key: 'proforma',    label: 'Proforma del proveedor', from: 'pedido',    cats: ['Proforma'] },
  { key: 'factura',     label: 'Factura comercial',      from: 'transito',  cats: ['Factura 1', 'Factura 2'] },
  { key: 'packing',     label: 'Packing list',           from: 'transito',  cats: ['Packing List'] },
  { key: 'bl',          label: 'Bill of Lading (BL)',    from: 'transito',  cats: ['BL'] },
  { key: 'origen',      label: 'Certificado de origen',  from: 'aduana',    cats: ['Certificado de origen'], optional: true },
  { key: 'vep',         label: 'VEP (pago de tributos)', from: 'aduana',    cats: ['VEP'] },
  { key: 'despachante', label: 'Factura del despachante', from: 'entregado', cats: ['FC Despachante'] },
  { key: 'flete',       label: 'Factura del flete',      from: 'entregado', cats: ['FC Flete'] },
  { key: 'deposito',    label: 'Factura del depósito fiscal', from: 'entregado', cats: ['FC Depósito Fiscal'], optional: true },
]

function docsStatus(o) {
  const idx = S_ORDER.indexOf(o.estado)
  return DOC_REQS.map(d => {
    const viaFile = (o.archivos || []).some(f => d.cats.includes(f.categoria))
    const manual = o.docsCheck?.[d.key] || null
    return { ...d, needed: idx >= S_ORDER.indexOf(d.from), done: viaFile || !!manual, viaFile, manual }
  })
}
// Documentos obligatorios que ya deberían estar y faltan (solo órdenes activas).
function docsMissing(o) {
  if (o.estado === 'entregado') return []
  return docsStatus(o).filter(d => d.needed && !d.done && !d.optional)
}

function detDocumentos(o) {
  const st = docsStatus(o)
  const missing = st.filter(d => d.needed && !d.done && !d.optional).length
  const row = d => {
    const icon = d.done ? '✅' : d.needed ? (d.optional ? '➖' : '⚠️') : '⬜'
    const note = d.viaFile ? '<span class="text-green" style="font-size:11px">archivo adjunto</span>'
      : d.manual ? `<span style="font-size:11px;color:var(--text2)">${d.manual === 'na' ? 'no aplica' : 'marcado como recibido'}</span>`
      : d.needed ? `<span style="font-size:11px;color:${d.optional ? 'var(--text3)' : 'var(--amber-t)'}">${d.optional ? 'opcional' : 'falta'}</span>`
      : `<span style="font-size:11px;color:var(--text3)">se pide desde ${S_LABELS[d.from]}</span>`
    const actions = d.viaFile ? '' : d.manual
      ? `<button class="btn btn-ghost btn-xs" onclick="setDocCheck('${o.id}','${d.key}',null)">Deshacer</button>`
      : `<button class="btn btn-ghost btn-xs" onclick="renderDetailTabs(getOrders().find(x=>x.id==='${o.id}'),'archivos')">Adjuntar</button>
         <button class="btn btn-ghost btn-xs" onclick="setDocCheck('${o.id}','${d.key}','ok')">Lo tengo</button>
         <button class="btn btn-ghost btn-xs" onclick="setDocCheck('${o.id}','${d.key}','na')">No aplica</button>`
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border)">
      <span style="font-size:15px">${icon}</span>
      <div style="flex:1"><div style="font-size:13px;font-weight:600">${d.label}</div>${note}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${actions}</div>
    </div>`
  }
  return `<div style="font-size:12px;margin-bottom:10px;color:${missing ? 'var(--amber-t)' : 'var(--green-t)'};font-weight:600">
      ${missing ? `Faltan ${missing} documento${missing > 1 ? 's' : ''} para la etapa actual (${S_LABELS[o.estado]}).` : 'Todos los documentos de la etapa actual están al día.'}
    </div>
    <div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden">${st.map(row).join('')}</div>
    <p style="font-size:11px;color:var(--text3);margin-top:8px">Al adjuntar un archivo en la categoría que corresponde (pestaña Archivos), el documento se marca solo.</p>`
}

function setDocCheck(orderId, key, value) {
  const orders = getOrders(); const o = orders.find(x => x.id === orderId); if (!o) return
  o.docsCheck = o.docsCheck || {}
  if (value) o.docsCheck[key] = value; else delete o.docsCheck[key]
  saveOrders(orders)
  renderDetailTabs(o, 'documentos')
}

/* ════════════════════════════════════
   FLUJO DE CAJA PROYECTADO
   Por cada orden activa: saldo al proveedor, flete y nacionalización (tributos + gastos),
   ubicados en el tiempo según sus fechas, menos lo que ya está pagado o cargado como costo.

const CF_TYPES = {

  flete:     { label: 'Flete',             color: 'var(--teal-t)' },

function cashflowItems() {
  const items = []
  const cfg = getCalcConfig()
  ordersByCompany().filter(o => ['pedido', 'produccion', 'transito', 'aduana'].includes(o.estado)).forEach(o => {
    const fob = Number(o.fob_total) || 0
    const q = quoteOf(o)
    const cd = (!o._valoresReales && (q?.costoDetalle || o._costoDetalle)) || o._estimado?.costoDetalle || null
    const fleteEst = Number(q?.flete ?? o._flete) || 0
    let trib, loc, basado
    if (cd && (cd.total_trib || cd.total_locales)) {
      trib = Number(cd.total_trib) || 0
      loc = (Number(cd.total_locales) || 0) + (Number(cd.total_fee) || 0) + (Number(cd.iva_fee) || 0)
      basado = 'presupuesto'
    } else {
      const t = computeLanded(fob, fleteEst, cfg, 'A', true)
      trib = t.total_trib; loc = t.total_locales; basado = 'tasas generales'
    }
    const saldo = Math.max(0, fob - totalPagos(o))
    const fletePend = Math.max(0, fleteEst - totalCostosCat(o, 'naviera'))
    const tribPend = Math.max(0, trib - totalCostosCat(o, 'impuesto'))
    const locPend = Math.max(0, loc - totalCostosCat(o, 'otros'))
    // Sin ETA: se estima con la salida (ETD + 35 días) o con el fin de producción (+ 45 días).
    const etaish = o.eta || (o.etd ? addDaysISO(o.etd, 35) : o.fin_prod ? addDaysISO(o.fin_prod, 45) : null)
    const base = { orderId: o.id, code: o.code, proveedor: o.proveedor || '', basado }
    if (saldo > 0) items.push({ ...base, tipo: 'proveedor', monto: saldo, fecha: o.fin_prod || o.etd || (o.eta ? addDaysISO(o.eta, -30) : null) })
    if (fletePend > 0) items.push({ ...base, tipo: 'flete', monto: fletePend, fecha: etaish })
    if (tribPend > 0) items.push({ ...base, tipo: 'aduana', monto: tribPend, fecha: etaish ? addDaysISO(etaish, 3) : null })
    if (locPend > 0) items.push({ ...base, tipo: 'locales', monto: locPend, fecha: etaish ? addDaysISO(etaish, 7) : null })
  })
  return items
}

// Totales para el Dashboard, con el mismo criterio que la pantalla de flujo de caja.
function cashflowSummary() {
  const items = cashflowItems()
  const thisWeek = weekStartISO(todayISO()), lim30 = addDaysISO(todayISO(), 30)
  const venc = items.filter(i => i.fecha && weekStartISO(i.fecha) < thisWeek)
  const next = items.filter(i => i.fecha && weekStartISO(i.fecha) >= thisWeek && i.fecha <= lim30)
  const sum = a => a.reduce((s, x) => s + x.monto, 0)
  return { in30: sum(next), n30: next.length, vencido: sum(venc), nVencido: venc.length, total: sum(items), nTotal: items.length }
}

function weekStartISO(d) { const x = new Date(d + 'T12:00:00'); const dow = (x.getDay() + 6) % 7; x.setDate(x.getDate() - dow); return x.toISOString().slice(0, 10) }

function renderCashflow() {
  const items = cashflowItems()
  if (!items.length) return `<div class="card" style="text-align:center;padding:40px;color:var(--text3)">
    <div style="font-size:34px;margin-bottom:10px">📈</div>
    <div style="font-weight:600;color:var(--text2)">No hay pagos pendientes en las órdenes activas.</div>
    <div style="font-size:12px;margin-top:4px">El flujo de caja toma las órdenes en Pedido, Producción, Tránsito y Aduana.</div></div>`
  const WEEKS = 16
  const thisWeek = weekStartISO(todayISO())
  const buckets = new Map()
  for (let i = 0; i < WEEKS; i++) buckets.set(addDaysISO(thisWeek, i * 7), [])
  const vencido = [], sinFecha = [], despues = []
  items.forEach(it => {
    if (!it.fecha) return sinFecha.push(it)
    const w = weekStartISO(it.fecha)
    if (w < thisWeek) vencido.push(it)
    else if (buckets.has(w)) buckets.get(w).push(it)
    else despues.push(it)
  })
  const total = arr => arr.reduce((s, x) => s + x.monto, 0)
  const in30 = items.filter(it => it.fecha && it.fecha <= addDaysISO(todayISO(), 30) && weekStartISO(it.fecha) >= thisWeek)
  const in90 = items.filter(it => it.fecha && it.fecha <= addDaysISO(todayISO(), 90) && weekStartISO(it.fecha) >= thisWeek)
  const groups = [
    ...(vencido.length ? [{ label: '⚠️ Atrasado (fecha ya pasada)', items: vencido, warn: true }] : []),
    ...[...buckets.entries()].map(([w, arr]) => ({ label: 'Semana del ' + fmtDate(w), items: arr })),
    ...(despues.length ? [{ label: 'Más adelante', items: despues }] : []),
    ...(sinFecha.length ? [{ label: 'Sin fecha (cargá fin de producción o ETA)', items: sinFecha, warn: true }] : []),
  ]
  const max = Math.max(1, ...groups.map(g => total(g.items)))
  const kpi = (label, val, color, sub) => `<div class="card"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">${label}</div><div style="font-size:21px;font-weight:800;${color ? 'color:' + color : ''}">${fmtUSD(val)}</div>${sub ? `<div style="font-size:11px;color:var(--text3)">${sub}</div>` : ''}</div>`
  const usaGenerales = items.some(i => i.basado === 'tasas generales')
  return `
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px">
    ${kpi('Próximos 30 días', total(in30), 'var(--amber-t)')}
    ${kpi('Próximos 90 días', total(in90))}
    ${kpi('Atrasado', total(vencido), vencido.length ? 'var(--red-t)' : '', vencido.length ? vencido.length + ' pagos' : 'nada atrasado')}
    ${kpi('Total comprometido', total(items), '', items.length + ' pagos en ' + new Set(items.map(i => i.orderId)).size + ' órdenes')}
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px">${Object.values(CF_TYPES).map(t => `<span style="font-size:11px;display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:${t.color}"></span>${t.label}</span>`).join('')}</div>
  <div class="card" style="padding:6px 12px">
    ${groups.map(g => {
      const t = total(g.items)
      const byType = Object.keys(CF_TYPES).map(k => [k, total(g.items.filter(i => i.tipo === k))]).filter(([, v]) => v > 0)
      return `<details style="border-bottom:1px solid var(--border);padding:7px 0" ${g.warn && t ? 'open' : ''}>
        <summary style="display:grid;grid-template-columns:minmax(150px,210px) 1fr 120px;gap:10px;align-items:center;cursor:${t ? 'pointer' : 'default'};list-style:none">
          <span style="font-size:12px;font-weight:600;${g.warn ? 'color:var(--amber-t)' : t ? '' : 'color:var(--text3)'}">${g.label}</span>
          <span style="display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface2)">
            ${byType.map(([k, v]) => `<span title="${CF_TYPES[k].label}: ${fmtUSD(v)}" style="width:${v / max * 100}%;background:${CF_TYPES[k].color}"></span>`).join('')}
          </span>
          <span class="money" style="text-align:right;font-size:13px;${t ? 'font-weight:700' : 'color:var(--text3)'}">${t ? fmtUSD(t) : '—'}</span>
        </summary>
        ${g.items.length ? `<div style="padding:6px 0 2px 12px">${g.items.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || '')).map(i => `
          <div style="display:grid;grid-template-columns:90px 1fr 140px 110px;gap:8px;font-size:12px;padding:3px 0;align-items:center">
            <span class="mono" style="cursor:pointer;font-weight:600" onclick="openDetail('${i.orderId}')">${esc(i.code)}</span>
            <span style="color:var(--text2)">${CF_TYPES[i.tipo].label}${i.proveedor ? ' · ' + esc(i.proveedor) : ''}${i.basado === 'tasas generales' && i.tipo !== 'proveedor' ? ' <span title="Sin presupuesto: estimado con las tasas generales" style="cursor:help">*</span>' : ''}</span>
            <span style="color:var(--text3)">${i.fecha ? fmtDate(i.fecha) : 'sin fecha'}</span>
            <span class="money" style="text-align:right">${fmtUSD(i.monto)}</span>
          </div>`).join('')}</div>` : ''}
      </details>`
    }).join('')}
  </div>
  <p style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5">
    Fechas: el saldo al proveedor se ubica en el fin de producción (o ETD); flete, tributos y gastos locales alrededor de la ETA
    (si falta, se estima con la salida + 35 días o el fin de producción + 45 días).
    Se descuenta lo ya pagado (pestaña Pagos) y los costos ya cargados (pestaña Costos).
    Los tributos incluyen IVA y percepciones que después recuperás como crédito fiscal.${usaGenerales ? ' * Órdenes sin presupuesto: estimado con las tasas generales de la calculadora.' : ''}
  </p>`
}

/* ════════════════════════════════════
   ESTIMADO VS. REAL
════════════════════════════════════ */
function renderAnalysis() {
  const orders = ordersByCompany()
  const done = orders.filter(o => o._valoresReales || o.estado === 'entregado').map(o => {
    const q = quoteOf(o)
    const real = o._valoresReales ? Number(q?.landedTotal ?? o._landedTotal) || null : null
    const est = Number(o._estimado?.landed) || null
    const fleteReal = o._valoresReales ? Number(q?.flete ?? o._flete) || 0 : null
    const fleteEst = o._estimado ? Number(o._estimado.flete) || 0 : null
    const atraso = o._eta_original && o.fecha_entrega ? daysBetween(o._eta_original, o.fecha_entrega) : null
    return { o, est, real, desvio: est && real ? (real - est) / est * 100 : null, fleteEst, fleteReal, atraso }
  })
  const active = orders.filter(o => o.estado !== 'entregado' && o._eta_original && o.eta && o.eta !== o._eta_original)
    .map(o => ({ o, corrimiento: daysBetween(o._eta_original, o.eta) }))
  const comparables = done.filter(r => r.desvio !== null || r.atraso !== null)
  const sinEstimado = done.filter(r => r.est === null).length

  const bySupp = {}
  comparables.forEach(r => {
    const k = r.o.proveedor || 'Sin proveedor'
    const s = bySupp[k] = bySupp[k] || { n: 0, desv: [], atr: [] }
    s.n++; if (r.desvio !== null) s.desv.push(r.desvio); if (r.atraso !== null) s.atr.push(r.atraso)
  })
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null
  const pct = v => v === null ? '—' : `<span style="color:${v > 5 ? 'var(--red-t)' : v < -5 ? 'var(--green-t)' : 'var(--text)'};font-weight:700">${v > 0 ? '+' : ''}${v.toFixed(1)}%</span>`
  const dias = v => v === null ? '—' : `<span style="color:${v > 7 ? 'var(--red-t)' : v <= 0 ? 'var(--green-t)' : 'var(--amber-t)'};font-weight:700">${v > 0 ? '+' + Math.round(v) + ' días' : v < 0 ? Math.round(v) + ' días' : 'a tiempo'}</span>`

  return `
  ${!comparables.length ? `<div class="card mb16" style="font-size:13px;color:var(--text2);line-height:1.55">
    <b>Todavía no hay órdenes para comparar.</b> Desde esta versión, el CRM guarda el costo estimado de cada orden (del presupuesto)
    y la ETA original. Cuando una orden se entrega y cargás los valores reales, aparece acá la diferencia, agrupada por proveedor.
    ${sinEstimado ? `<br><span style="color:var(--text3);font-size:12px">${sinEstimado} orden${sinEstimado > 1 ? 'es' : ''} entregada${sinEstimado > 1 ? 's' : ''} antes de esta versión no tiene${sinEstimado > 1 ? 'n' : ''} el estimado guardado, porque se pisaba al cargar los valores reales.</span>` : ''}
  </div>` : ''}
  ${Object.keys(bySupp).length ? `<div class="section-title mb8">Por proveedor</div>
  <div class="table-wrap mb16"><table>
    <thead><tr><th>Proveedor</th><th>Órdenes</th><th>Desvío de costo promedio</th><th>Atraso promedio vs. ETA original</th></tr></thead>
    <tbody>${Object.entries(bySupp).sort((a, b) => b[1].n - a[1].n).map(([k, s]) => `<tr>
      <td style="font-weight:600">${esc(k)}</td><td class="mono">${s.n}</td><td>${pct(avg(s.desv))}</td><td>${dias(avg(s.atr))}</td></tr>`).join('')}
    </tbody></table></div>` : ''}
  ${comparables.length ? `<div class="section-title mb8">Por orden</div>
  <div class="table-wrap mb16"><table>
    <thead><tr><th>Orden</th><th>Proveedor</th><th>Landed estimado</th><th>Landed real</th><th>Desvío</th><th>Flete est. → real</th><th>Entrega vs. ETA</th></tr></thead>
    <tbody>${comparables.map(r => `<tr>
      <td class="mono" style="font-weight:600;cursor:pointer" onclick="openDetail('${r.o.id}')">${esc(r.o.code)}</td>
      <td class="td-sm">${esc(r.o.proveedor || '—')}</td>
      <td class="money">${r.est ? fmtUSD(r.est) : '—'}</td>
      <td class="money">${r.real ? fmtUSD(r.real) : '<span class="text-muted">sin cargar</span>'}</td>
      <td>${pct(r.desvio)}</td>
      <td class="money td-sm">${r.fleteEst !== null && r.fleteReal !== null ? fmtUSD(r.fleteEst) + ' → ' + fmtUSD(r.fleteReal) : '—'}</td>
      <td>${dias(r.atraso)}</td></tr>`).join('')}
    </tbody></table></div>` : ''}
  ${active.length ? `<div class="section-title mb8">Órdenes activas con la ETA corrida</div>
  <div class="table-wrap"><table>
    <thead><tr><th>Orden</th><th>Proveedor</th><th>Estado</th><th>ETA original</th><th>ETA actual</th><th>Corrimiento</th></tr></thead>
    <tbody>${active.map(r => `<tr>
      <td class="mono" style="font-weight:600;cursor:pointer" onclick="openDetail('${r.o.id}')">${esc(r.o.code)}</td>
      <td class="td-sm">${esc(r.o.proveedor || '—')}</td><td>${badge(r.o.estado)}</td>
      <td class="td-sm">${fmtDate(r.o._eta_original)}</td><td class="td-sm">${fmtDate(r.o.eta)}</td><td>${dias(r.corrimiento)}</td></tr>`).join('')}
    </tbody></table></div>` : ''}`
}

const DQ_NUMERIC = ['fob_total', '_flete']
function dqSet(orderId, field, value) {
  const orders = getOrders(); const o = orders.find(x => x.id === orderId); if (!o) return
  const v = DQ_NUMERIC.includes(field) ? (parseFloat(value) || 0) : value.trim()
  if (o[field] === v) return
  o[field] = v
  trackOrderChange(o, o.estado)
  saveOrders(orders)
  toast(`${o.code}: guardado ✓`)
  renderPage()
}

function dqMove(orderId, estado) {
  const orders = getOrders(); const o = orders.find(x => x.id === orderId); if (!o) return
  const prev = o.estado
  o.estado = estado
  trackOrderChange(o, prev)
  saveOrders(orders)
  const faltan = docsMissing(o)
  toast(`${o.code} → ${S_LABELS[estado]}${faltan.length ? ' · ⚠️ faltan: ' + faltan.map(d => d.label).join(', ') : ''}`)
  renderPage()
  if (estado === 'entregado' && prev !== 'entregado') setTimeout(() => openRealValuesModal(orderId), 400)
}

function dqOpen(orderId, tab) {
  openDetail(orderId)
  renderDetailTabs(getOrders().find(x => x.id === orderId), tab)
}

}
const STAGE5 = ['pedido', 'produccion', 'transito', 'aduana', 'entregado']
const STAGE_COLOR = { muestra: '#98A2B3', cotizacion: '#98A2B3', pedido: '#1F4FD1', produccion: '#7A5AF8', transito: '#0E7490', aduana: '#B54708', entregado: '#067647' }
function usd(n, dec) { return 'USD ' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 }) }
function shortDate(d) { try { return new Date(d + 'T12:00:00').toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }) } catch { return d } }
function daysAgo(d) { return d ? daysBetween(d, todayISO()) : 0 }
function plural(n, a, b) { return n === 1 ? a : b }
function orderIssues(o) { return DQ_CHECKS.filter(c => { try { return c.test(o) } catch { return false } }) }
function dqGo(key) { dqFilter = key; nav('dataquality') }
function goOrders(f) { ordersFilter = f; ordersView = 'tabla'; nav('orders') }
function stageDots(estado) {
  const idx = STAGE5.indexOf(estado), c = STAGE_COLOR[estado]
  return `<div class="dots" aria-hidden="true">${STAGE5.map((s, i) => `<span style="${i <= idx ? 'background:' + c : ''}"></span>`).join('')}</div>`
}
function docsCount(o) {
  const st = docsStatus(o).filter(d => d.needed && !d.optional)
  return { need: st.length, done: st.filter(d => d.done).length }
}

/* ── Órdenes ── */
let ordersFilter = 'curso', ordersView = 'tabla', ordersSearch = ''
const ORDER_FILTERS = [['curso', 'En curso'], ['previo', 'Muestra y cotización'], ['pedido', 'Pedido'], ['produccion', 'Producción'], ['transito', 'Tránsito'], ['aduana', 'Aduana'], ['entregado', 'Entregadas'], ['pendientes', 'Con pendientes'], ['todas', 'Todas']]
function orderMatches(o, f) {
  if (f === 'todas') return true
  if (f === 'curso') return DQ_ACTIVE.includes(o.estado)
  if (f === 'previo') return o.estado === 'muestra' || o.estado === 'cotizacion'
  if (f === 'pendientes') return orderIssues(o).length > 0
  return o.estado === f
}
function ordersBase() {
  let os = ordersByCompany()
  if (folderFilter) os = os.filter(o => o.folderId === folderFilter)
  const q = ordersSearch.trim().toLowerCase()
  if (q) os = os.filter(o => [o.code, o.proveedor, o.bl, o.categoria, o.buque].some(v => (v || '').toLowerCase().includes(q)))
  return os
}
function orderRowHtml(o) {
  const fob = Number(o.fob_total) || 0, pag = totalPagos(o), pct = fob ? Math.round(pag / fob * 100) : null
  const late = o.eta && o.eta < todayISO() && ['transito', 'aduana'].includes(o.estado)
  const needsEta = ['produccion', 'transito', 'aduana'].includes(o.estado)
  const eta = o.eta ? (late ? `<span class="pill ${o.estado === 'transito' ? 'red' : 'amber'}">${shortDate(o.eta)} · hace ${daysAgo(o.eta)} d</span>` : `<span style="font-size:13px;color:#344054">${shortDate(o.eta)}</span>`)
    : needsEta ? '<span class="pill amber">Sin ETA</span>' : '<span class="muted">—</span>'
  const dc = docsCount(o)
  const docs = o.estado === 'entregado' || !dc.need ? '<span class="muted">—</span>' : dc.done === dc.need ? '<span class="pill green">Completos</span>' : `<span class="pill amber">${dc.done} de ${dc.need}</span>`
  const iss = orderIssues(o)
  const next = iss.length ? `<span style="color:${iss[0].key === 'pagos' ? 'var(--red-t)' : 'var(--amber-t)'};font-weight:500">${iss[0].label}${iss.length > 1 ? ` <span class="muted">+${iss.length - 1}</span>` : ''}</span>` : '<span style="color:var(--green-t);font-weight:500">Al día</span>'
  return `<tr onclick="openDetail('${o.id}')">
    <td style="min-width:210px"><span class="code">${esc(o.code)}</span><div class="muted" style="margin-top:2px">${esc(o.proveedor || 'Sin proveedor')}</div></td>
    <td style="white-space:nowrap">${STAGE5.includes(o.estado) ? stageDots(o.estado) : ''}<span style="font-size:13px;font-weight:600;color:${STAGE_COLOR[o.estado]}">${S_LABELS[o.estado] || o.estado}</span></td>
    <td style="white-space:nowrap">${eta}</td>
    <td class="r" style="font-weight:600;white-space:nowrap">${fob ? usd(fob, true) : '<span class="muted">—</span>'}</td>
    <td style="min-width:110px">${pct === null ? '<span class="muted">Sin FOB</span>' : `<div style="font-size:13px;font-weight:600;${pct > 110 ? 'color:var(--red-t)' : ''}">${pct}%</div><div class="bar" style="height:6px;margin-top:5px"><div style="width:${Math.min(100, pct)}%;background:${pct > 110 ? 'var(--red)' : 'var(--green)'}"></div></div>`}</td>
    <td style="white-space:nowrap">${docs}</td>
    <td style="font-size:13px;min-width:180px">${next}</td>
  </tr>`
}
function ordersRowsHtml() {
  const rows = ordersBase().filter(o => orderMatches(o, ordersFilter))
  return rows.length ? rows.map(orderRowHtml).join('') : `<tr style="cursor:default"><td colspan="7" style="padding:28px;text-align:center" class="muted">No hay órdenes ${ordersSearch ? 'que coincidan con la búsqueda' : 'en este filtro'}.</td></tr>`
}
function setOrdersFilter(f) { ordersFilter = f; renderPage() }
function setOrdersView(v) { ordersView = v; renderPage() }
function onOrdersSearch(v) { ordersSearch = v; const tb = document.getElementById('orders-rows'); if (tb) tb.innerHTML = ordersRowsHtml() }
function kanbanHtml() {
  // Reusa el tablero de tarjetas de antes (arrastrar para cambiar de estado).
  const html = renderDashboard()
  const style = (html.match(/<style>[\s\S]*?<\/style>/) || [''])[0]
  const a = html.indexOf('<!-- KANBAN HORIZONTAL -->'), b = html.indexOf('<!-- Próximas llegadas -->')
  return style + (a >= 0 && b > a ? html.slice(a, b) : '')
}
