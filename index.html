    </div>
    <button type="button" class="btn btn-primary" style="min-height:44px" onclick="openNewOrder()">${IC.plus} Nueva orden</button>
  </div>
  ${ordersView === 'tablero' ? kanbanHtml() : `
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
    ${chips.map(([k, l, n]) => `<button type="button" class="chip${ordersFilter === k ? ' active' : ''}" aria-pressed="${ordersFilter === k}" onclick="setOrdersFilter('${k}')">${l} <span class="chip-n">${n}</span></button>`).join('')}
    ${folders.length ? `<label class="sr" for="ord-folder">Carpeta</label><select id="ord-folder" class="select" style="width:auto;min-height:38px;border-radius:20px" onchange="folderFilter=this.value||null;renderPage()"><option value="">Todas las carpetas</option>${folders.map(f => `<option value="${f.id}" ${folderFilter === f.id ? 'selected' : ''}>${esc(f.nombre)}</option>`).join('')}</select>` : ''}
    <label class="sr" for="ord-search">Buscar en órdenes</label>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;background:#fff;border:1px solid var(--border2);border-radius:10px;flex:0 1 280px">
      ${IC.search}<input id="ord-search" type="search" value="${esc(ordersSearch)}" placeholder="Orden, proveedor, BL…" oninput="onOrdersSearch(this.value)" style="border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:14px;background:transparent"/>
    </div>
  </div>
  <section class="box" style="overflow:hidden">
    <div style="overflow-x:auto"><table class="tbl" style="min-width:980px">
      <thead><tr><th>Orden</th><th>Etapa</th><th>Llegada (ETA)</th><th class="r">FOB</th><th>Pagado</th><th>Documentos</th><th>Próximo paso</th></tr></thead>
      <tbody id="orders-rows">${ordersRowsHtml()}</tbody>
    </table></div>
  </section>`}`
}

/* ── Detalle de orden (página) ── */
let orderTab = 'productos'
function openDetail(id) {
  if (!getOrders().find(x => x.id === id)) return
  const same = currentPage === 'order' && detailOrderId === id
  detailOrderId = id
  if (same) renderPage(); else nav('order')
}
// Compatibilidad: lo que antes cambiaba de pestaña en la ventana, ahora va a la sección de la página.
function renderDetailTabs(o, tab) {
  if (!o) return
  if (tab && !['general', 'documentos'].includes(tab)) orderTab = tab
  openDetail(o.id)
  const target = tab === 'documentos' ? 'sec-docs' : tab && tab !== 'general' ? 'sec-tabs' : null
  if (target) setTimeout(() => document.getElementById(target)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60)
}
function setOrderTab(t) { orderTab = t; renderPage(); setTimeout(() => document.getElementById('sec-tabs')?.scrollIntoView({ block: 'start' }), 30) }

function renderOrderPage() {
  const o = getOrders().find(x => x.id === detailOrderId)
  if (!o) return `<div class="box" style="padding:40px;text-align:center"><p class="muted">Esta orden no existe o fue borrada.</p><button type="button" class="btn" onclick="nav('orders')">Volver a Órdenes</button></div>`
  const idx = STAGE5.indexOf(o.estado)
  const next = idx < 0 ? 'pedido' : STAGE5[idx + 1]
  const fob = Number(o.fob_total) || 0, pag = totalPagos(o), pct = fob ? Math.round(pag / fob * 100) : null
  const iss = orderIssues(o)
  const supp = getSuppliers().find(s => s.nombre === o.proveedor)
  const sub = [o.proveedor, supp?.apodo, o.categoria].filter(Boolean).map(esc).join(' · ')

  const stepSub = { pedido: o.createdAt ? 'Creada ' + shortDate(o.createdAt) : '', produccion: o.fin_prod ? 'Fin ' + shortDate(o.fin_prod) : '', transito: o.eta ? 'ETA ' + shortDate(o.eta) : '', aduana: o.estado === 'aduana' && o.eta && o.eta < todayISO() ? `Hace ${daysAgo(o.eta)} días` : '', entregado: o.fecha_entrega ? shortDate(o.fecha_entrega) : '' }
  const steps = STAGE5.map((s, i) => {
    const done = idx > i || (o.estado === 'entregado' && i === 4), cur = idx === i && s !== 'entregado'
    const c = done ? 'var(--green)' : cur ? STAGE_COLOR[s] : 'var(--border)'
    return `<li><div class="sb" style="background:${c}"></div><div style="display:flex;align-items:center;gap:6px;font-weight:600;color:${done ? 'var(--green-t)' : cur ? STAGE_COLOR[s] : 'var(--text3)'}">${done ? IC.check : ''}${s === 'entregado' ? 'Entregada' : S_LABELS[s]}</div><div class="muted" style="font-size:12px">${cur && !stepSub[s] ? 'Etapa actual' : stepSub[s] || (done ? '' : 'Pendiente')}</div></li>`
  }).join('')

  const red = iss.some(i => ['pagos', 'eta_pasada'].includes(i.key))
  const callout = iss.length ? `<div class="callout ${red ? 'red' : 'amber'}" role="status" style="margin-bottom:18px">${IC.alert}<div><b>${iss.length === 1 ? 'Falta resolver 1 cosa' : `Faltan resolver ${iss.length} cosas`}:</b> ${iss.map(i => i.label).join(' · ')}.</div></div>` : ''

  const fact = (label, value, warn) => `<div><dt>${label}</dt><dd style="${warn ? 'color:var(--amber-t)' : ''}">${value}</dd></div>`
  const needsEta = ['produccion', 'transito', 'aduana'].includes(o.estado)
  const cbm = (o.contenedores || []).reduce((s, c) => s + (Number(c.cbm) || 0), 0) || Number(o.cbm_est) || 0
  const facts = [
    fact('FOB', fob ? usd(fob, true) : dqIn(o, 'fob_total', 'number', 'min="0" step="0.01" aria-label="FOB"'), !fob),
    fact('Pagado al proveedor', `${usd(pag, true)}${pct !== null ? ` <span class="muted" style="font-weight:500">(${pct}%)</span>` : ''}`),
    fact('Llegada (ETA)', o.eta ? fmtDateFull(o.eta) : needsEta ? dqIn(o, 'eta', 'date', 'aria-label="ETA"') : '—'),
    fact('Fin de producción', o.fin_prod ? fmtDateFull(o.fin_prod) : ['pedido', 'produccion'].includes(o.estado) ? dqIn(o, 'fin_prod', 'date', 'aria-label="Fin de producción"') : '—'),
    fact('Número de BL', o.bl ? `<span class="code">${esc(o.bl)}</span>` : ['transito', 'aduana'].includes(o.estado) ? dqIn(o, 'bl', 'text', 'placeholder="ej: EISU9245083" aria-label="Número de BL"') : '—'),
    fact('Naviera y buque', esc([o.naviera, o.buque].filter(Boolean).join(' · ')) || '—'),
    fact('Volumen', cbm ? cbm.toFixed(1).replace('.', ',') + ' m³' : '—'),
    fact('Incoterm / puerto', esc([o.incoterm, o.puerto].filter(Boolean).join(' · ')) || '—'),
  ].join('')

  const docRows = docsStatus(o).map(d => {
    const color = d.done ? 'var(--green)' : d.needed && !d.optional ? 'var(--amber)' : 'var(--border2)'
    const subTxt = d.viaFile ? '<span style="color:var(--green-t)">Archivo adjunto</span>' : d.manual ? (d.manual === 'na' ? 'No aplica' : 'Marcado como recibido') : d.needed ? (d.optional ? 'Opcional' : '<span style="color:var(--amber-t)">Falta</span>') : `Se pide desde ${S_LABELS[d.from]}`
    const fileIdx = (o.archivos || []).findIndex(f => d.cats.includes(f.categoria))
    const actions = d.viaFile ? `<button type="button" class="btn btn-sm" onclick="previewFile('${o.id}',${fileIdx})">Ver</button>`
      : d.manual ? `<button type="button" class="btn btn-sm btn-ghost" onclick="setDocCheck('${o.id}','${d.key}',null)">Deshacer</button>`
      : `<label class="btn btn-sm${d.needed ? '' : ' btn-ghost'}" style="cursor:pointer">Adjuntar<input type="file" class="sr" onchange="handleFileSelectCat(event,'${o.id}','${d.cats[0]}')"/></label>
         ${d.needed ? `<button type="button" class="btn btn-sm btn-ghost" onclick="setDocCheck('${o.id}','${d.key}','ok')">Lo tengo</button>
         <button type="button" class="btn btn-sm btn-ghost" onclick="setDocCheck('${o.id}','${d.key}','na')">No aplica</button>` : ''}`
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid #EEF0F3;flex-wrap:wrap">
      <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0" aria-hidden="true"></span>
      <div style="flex:1 1 200px;min-width:0"><div style="font-size:14px;font-weight:600">${d.label}</div><div style="font-size:12px;color:var(--text3)">${subTxt}</div></div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">${actions}</div></div>`
  }).join('')
  const dc = docsCount(o)

  // Costo estimado vs. real
  const q = quoteOf(o)
  const est = o._estimado, estCd = est?.costoDetalle || null
  const realCd = o._valoresReales ? (q?.costoDetalle || o._costoDetalle || null) : null
  const realTotal = o._valoresReales ? Number(q?.landedTotal ?? o._landedTotal) || null : null
  const realFlete = o._valoresReales ? Number(q?.flete ?? o._flete) || 0 : null
  const gastos = cd => cd ? (Number(cd.total_locales) || 0) + (Number(cd.total_fee) || 0) + (Number(cd.iva_fee) || 0) : null
  const cell = v => v === null || v === undefined ? '<span class="muted">—</span>' : usd(v, true)
  const diffCell = (a, b) => a && b ? (() => { const d = (b - a) / a * 100; return `<span style="color:${d > 5 ? 'var(--red-t)' : d < -5 ? 'var(--green-t)' : 'var(--text2)'};font-weight:600">${d > 0 ? '+' : ''}${d.toFixed(1).replace('.', ',')}%</span>` })() : ''
  const costRows = [
    ['Mercadería (FOB)', est ? Number(est.fob) || fob : null, o._valoresReales ? fob : null],
    ['Flete', est ? Number(est.flete) || 0 : null, realFlete],
    ['Tributos', estCd ? Number(estCd.total_trib) || 0 : null, realCd ? Number(realCd.total_trib) || 0 : null],
    ['Gastos locales y fee', gastos(estCd), gastos(realCd)],
  ]
  const costBox = `<section class="box" style="padding:18px 20px">
    <h2 style="margin:0 0 4px;font-size:17px;font-weight:700">Costo: estimado y real</h2>
    <p class="muted" style="margin:0 0 12px">${est ? `Estimado guardado el ${shortDate(est.fecha)}${est.origen && est.origen !== 'orden' ? ' (presupuesto ' + esc(est.origen) + ')' : ''}.` : 'Esta orden no tiene un costo estimado guardado.'} ${o._valoresReales ? 'Valores reales cargados.' : 'El real se carga al entregar.'}</p>
    <div style="overflow-x:auto"><table class="tbl" style="min-width:460px"><thead><tr><th>Concepto</th><th class="r">Estimado</th><th class="r">Real</th><th class="r">Diferencia</th></tr></thead><tbody>
      ${costRows.map(([l, a, b]) => `<tr style="cursor:default"><td>${l}</td><td class="r">${cell(a)}</td><td class="r">${cell(b)}</td><td class="r">${diffCell(a, b)}</td></tr>`).join('')}
      <tr style="cursor:default;font-weight:700"><td>Costo total (landed)</td><td class="r">${cell(est ? Number(est.landed) : null)}</td><td class="r">${realTotal ? usd(realTotal, true) : '<span class="muted" style="font-weight:500">al entregar</span>'}</td><td class="r">${diffCell(est ? Number(est.landed) : 0, realTotal)}</td></tr>
    </tbody></table></div>
    ${o.estado === 'entregado' ? `<button type="button" class="btn ${o._valoresReales ? '' : 'btn-primary'}" style="margin-top:12px" onclick="openRealValuesModal('${o.id}')">${o._valoresReales ? 'Editar valores reales' : 'Cargar valores reales'}</button>` : ''}
  </section>`

  // Columna derecha: próximo paso, pagos, actividad
  const pend = cashflowItems().filter(i => i.orderId === o.id)
  const nextBox = `<section class="box" style="padding:18px 20px;background:#F2F5FF;border-color:#D6E0FB">
    <div style="font-size:12px;font-weight:600;color:var(--blue)">Próximo paso</div>
    ${iss.length ? `<h2 style="margin:4px 0 10px;font-size:17px;font-weight:700">${iss[0].label}</h2>
      <p style="margin:0 0 12px;font-size:14px;color:#344054;line-height:1.5">${iss[0].why}</p>
      ${iss.length > 1 ? `<ul style="margin:0 0 12px;padding-left:18px;font-size:13px;color:#344054;line-height:1.7">${iss.slice(1).map(i => `<li>${i.label}</li>`).join('')}</ul>` : ''}`
    : `<h2 style="margin:4px 0 10px;font-size:17px;font-weight:700">${next ? 'Todo al día para avanzar' : 'Orden cerrada'}</h2>`}
    ${next ? `<button type="button" class="btn btn-primary" style="width:100%;min-height:44px" onclick="dqMove('${o.id}','${next}')">Pasar a ${next === 'entregado' ? 'Entregada' : S_LABELS[next]}</button>` : ''}
  </section>`
  const pagosBox = `<section class="box" style="padding:18px 20px">
    <h2 style="margin:0 0 12px;font-size:17px;font-weight:700">Pagos</h2>
    <div style="display:flex;justify-content:space-between;font-size:14px"><span>Proveedor</span><b>${usd(pag, true)}</b></div>
    <div class="bar" style="height:6px;margin:6px 0 4px"><div style="width:${Math.min(100, pct || 0)}%;background:${pct > 110 ? 'var(--red)' : 'var(--green)'}"></div></div>
    <div style="font-size:12px;font-weight:600;color:${pct > 110 ? 'var(--red-t)' : pct >= 100 ? 'var(--green-t)' : 'var(--text2)'};margin-bottom:12px">${pct === null ? 'Sin FOB cargado' : pct + '% del FOB'}</div>
    ${pend.map(i => { const late = i.fecha && i.fecha < todayISO(); return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;padding:10px 0;border-top:1px solid #EEF0F3"><span>${CF_TYPES[i.tipo].label}</span><span class="pill ${late ? 'red' : i.fecha ? 'gray' : 'amber'}">${usd(i.monto)} · ${i.fecha ? (late ? 'vencido' : shortDate(i.fecha)) : 'sin fecha'}</span></div>` }).join('')}
    <button type="button" class="btn" style="width:100%;margin-top:12px" onclick="openPagoModal('${o.id}')">Registrar pago</button>
  </section>`
  const acts = []
  if (o.createdAt) acts.push([o.createdAt, 'Orden creada'])
  if (est) acts.push([est.fecha, `Se guardó el costo estimado: ${usd(est.landed)}`])
  if (o._eta_original && o.eta && o._eta_original !== o.eta) acts.push([o.eta, `La ETA se corrió del ${shortDate(o._eta_original)} al ${shortDate(o.eta)}`])
  else if (o.eta) acts.push([o.eta, 'Llegada estimada (ETA)'])
  if (o.fecha_entrega) acts.push([o.fecha_entrega, 'Entregada'])
  ;(o.pagos || []).forEach(p => p.fecha && acts.push([p.fecha, `Pago de ${usd(p.monto)}${p.tipo ? ' (' + esc(p.tipo) + ')' : ''}`]))
  acts.sort((a, b) => (b[0] || '').localeCompare(a[0] || ''))
  const actBox = `<section class="box" style="padding:18px 20px">
    <h2 style="margin:0 0 12px;font-size:17px;font-weight:700">Actividad</h2>
    ${acts.length ? `<ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px">${acts.slice(0, 8).map(([d, t]) => `<li style="display:flex;gap:10px"><span style="flex:0 0 8px;height:8px;border-radius:50%;background:#98A2B3;margin-top:6px" aria-hidden="true"></span><div><div style="font-size:14px">${t}</div><div class="muted" style="font-size:12px">${shortDate(d)}</div></div></li>`).join('')}</ol>` : '<p class="muted" style="margin:0">Sin actividad registrada.</p>'}
  </section>`

  const TABS = [['productos', 'Productos'], ['pagos', 'Pagos'], ['costos', 'Costos cargados'], ['contenedores', 'Contenedores'], ['archivos', 'Archivos'], ['timeline', 'Etapas']]
  const tabsBox = `<section class="box" id="sec-tabs" style="padding:6px 20px 18px">
    <div class="tabs" role="tablist" style="flex-wrap:wrap">${TABS.map(([k, l]) => `<button type="button" role="tab" aria-selected="${orderTab === k}" class="tab${orderTab === k ? ' active' : ''}" onclick="setOrderTab('${k}')">${l}</button>`).join('')}</div>
    <div>${detTabContent(o, orderTab)}</div>
  </section>`

  return `
  <nav aria-label="Ruta" style="font-size:13px;color:var(--text2);margin-bottom:12px"><button type="button" class="btn btn-ghost" style="padding:0;min-height:28px;color:var(--blue)" onclick="nav('orders')">Órdenes</button> / ${esc(o.code)}</nav>
  <div class="pg-head" style="align-items:flex-start">
    <div class="grow"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1>${esc(o.code)}</h1>${badge(o.estado)}</div><p>${sub || '&nbsp;'}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn" style="min-height:44px" onclick="editOrder()">Editar</button>
      <button type="button" class="btn" style="min-height:44px" onclick="openOrderSummaryModal('${o.id}')">Resumen PDF / Excel</button>
      <button type="button" class="btn btn-danger" style="min-height:44px" onclick="deleteOrder()">Eliminar</button>
    </div>
  </div>
  <ol class="steps box" aria-label="Etapas de la orden" style="margin-bottom:18px">${steps}</ol>
  ${callout}
  <div class="two-col">
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <section class="box" style="padding:18px 20px"><h2 style="margin:0 0 14px;font-size:17px;font-weight:700">Resumen</h2><dl class="facts">${facts}</dl></section>
      <section class="box" id="sec-docs"><div class="box-h"><h2>Documentos</h2><span class="sub" style="${dc.done < dc.need ? 'color:var(--amber-t);font-weight:600' : ''}">${dc.need ? (dc.done < dc.need ? `Faltan ${dc.need - dc.done} para la etapa ${S_LABELS[o.estado]}` : 'Al día para la etapa actual') : 'Todavía no se piden documentos'}</span></div>${docRows}</section>
      ${costBox}
      ${tabsBox}
    </div>
    <aside style="display:flex;flex-direction:column;gap:18px;min-width:0">${nextBox}${pagosBox}${actBox}</aside>
  </div>`
}

/* ── Pagos y caja ── */
function cfMarkPaid(orderId, tipo, monto) {
  const orders = getOrders(); const o = orders.find(x => x.id === orderId); if (!o) return
  if (!confirm(`¿Registrar ${usd(monto, true)} como pagado (${CF_TYPES[tipo].label}) en ${o.code}?`)) return
  const nota = 'Registrado desde Pagos y caja'
  if (tipo === 'proveedor') { o.pagos = o.pagos || []; o.pagos.push({ tipo: 'saldo', fecha: todayISO(), monto: Math.round(monto * 100) / 100, ref: '', notas: nota }) }
  else {
    const map = { flete: ['naviera', 'Flete marítimo'], aduana: ['impuesto', 'Tributos de aduana'], locales: ['otros', 'Gastos locales'] }[tipo]
    o.costos = o.costos || []; o.costos.push({ cat: map[0], concepto: map[1], monto: Math.round(monto * 100) / 100, fecha: todayISO(), nota })
  }
  saveOrders(orders); toast(`${o.code}: pago registrado ✓`); renderPage()
}
function cfChangeDate(orderId, tipo, value) {
  if (!value) return
  const orders = getOrders(); const o = orders.find(x => x.id === orderId); if (!o) return
  if (tipo === 'proveedor') o.fin_prod = value; else o.eta = value
  trackOrderChange(o, o.estado); saveOrders(orders)
  toast(`${o.code}: ${tipo === 'proveedor' ? 'fin de producción' : 'ETA'} actualizada ✓`); renderPage()
}
function renderCaja() {
  const items = cashflowItems()
  const cf = cashflowSummary()
  const thisWeek = weekStartISO(todayISO()), lim30 = addDaysISO(todayISO(), 30), lim90 = addDaysISO(todayISO(), 90)
  const sum = a => a.reduce((s, x) => s + x.monto, 0)
  const venc = items.filter(i => i.fecha && weekStartISO(i.fecha) < thisWeek).sort((a, b) => a.fecha.localeCompare(b.fecha))
  const d30 = items.filter(i => i.fecha && weekStartISO(i.fecha) >= thisWeek && i.fecha <= lim30)
  const d90 = items.filter(i => i.fecha && i.fecha > lim30 && i.fecha <= lim90)
  const later = items.filter(i => !i.fecha || i.fecha > lim90)
  const buckets = [['Atrasado', sum(venc), 'var(--red)'], ['Próximos 30 días', sum(d30), 'var(--blue)'], ['31 a 90 días', sum(d90), 'var(--teal)'], ['Más adelante o sin fecha', sum(later), '#98A2B3']]
  const max = Math.max(1, ...buckets.map(b => b[1]))
  const metric = (l, v, s, color) => `<div class="metric" style="cursor:default"><div class="m-l">${l}</div><div class="m-v" style="${color ? 'color:' + color : ''}">${v}</div><div class="m-s">${s}</div></div>`
  const upcoming = items.filter(i => i.fecha && weekStartISO(i.fecha) >= thisWeek).sort((a, b) => a.fecha.localeCompare(b.fecha))
  const sinFecha = items.filter(i => !i.fecha)
  const rowsOf = (arr, late) => arr.map(i => `<tr style="cursor:default">
      <td><button type="button" class="code" style="border:0;background:none;padding:0;cursor:pointer" onclick="openDetail('${i.orderId}')">${esc(i.code)}</button><div class="muted">${esc(i.proveedor || '')}</div></td>
      <td>${CF_TYPES[i.tipo].label}${i.basado === 'tasas generales' && i.tipo !== 'proveedor' ? ' <span class="muted" title="Sin presupuesto: estimado con las tasas generales">(estimado)</span>' : ''}</td>
      <td style="white-space:nowrap">${i.fecha ? (late ? `<span class="pill red">${shortDate(i.fecha)} · hace ${daysAgo(i.fecha)} d</span>` : shortDate(i.fecha)) : '<span class="pill amber">Sin fecha</span>'}</td>
      <td class="r" style="font-weight:700;white-space:nowrap">${usd(i.monto, true)}</td>
      <td class="r" style="white-space:nowrap">
        <button type="button" class="btn btn-sm" onclick="cfMarkPaid('${i.orderId}','${i.tipo}',${i.monto})">Marcar pagado</button>
        <label class="sr" for="cfd-${i.orderId}-${i.tipo}">Nueva fecha</label>
        <input id="cfd-${i.orderId}-${i.tipo}" type="date" class="input" title="${i.tipo === 'proveedor' ? 'Cambia el fin de producción' : 'Cambia la ETA de la orden'}" style="width:auto;min-height:36px;display:inline-block;padding:4px 8px;font-size:13px" onchange="cfChangeDate('${i.orderId}','${i.tipo}',this.value)"/>
      </td></tr>`).join('')
  const table = (title, sub, arr, late) => arr.length ? `<section class="box" style="margin-bottom:20px;overflow:hidden">
      <div class="box-h"><h2>${title}</h2><span class="sub">${sub}</span></div>
      <div style="overflow-x:auto"><table class="tbl" style="min-width:820px"><thead><tr><th>Orden</th><th>Concepto</th><th>Fecha</th><th class="r">Monto</th><th class="r">Acción</th></tr></thead><tbody>${rowsOf(arr, late)}</tbody></table></div>
    </section>` : ''
  return `
  <div class="pg-head"><div class="grow"><h1>Pagos y caja</h1><p>Lo que tenés que pagar, cuándo y por qué orden</p></div></div>
  <div class="grid-auto" style="margin-bottom:20px">

const Q_OPEN = ['borrador', 'enviado', 'en_negociacion']
function qPill(estado) { const s = Q_STATES.find(x => x[0] === estado) || [estado, estado, 'gray']; return `<span class="pill ${s[2]}">${s[1]}</span>` }
function qPaid(q) { return (q.pagos || []).reduce((s, p) => s + (Number(p.monto) || 0), 0) }

let quotesFilter = 'abiertos', quotesSearch = ''
function quoteMatches(q, f) {
  if (f === 'todos') return true
  if (f === 'abiertos') return Q_OPEN.includes(q.estado)
  if (f === 'sin_orden') return q.estado === 'aprobado' && !q.orderId
  if (f === 'vencidos') return Q_OPEN.includes(q.estado) && q.validez && q.validez < todayISO()
  return q.estado === f
}
function quotesRowsHtml() {
  const clients = getClients()
  const qs = getQuotes().filter(q => q.companyId === currentCompanyId).filter(q => quoteMatches(q, quotesFilter))

  if (!qs.length) return `<tr style="cursor:default"><td colspan="7" class="muted" style="padding:28px;text-align:center">No hay presupuestos ${quotesSearch ? 'que coincidan con la búsqueda' : 'en este filtro'}.</td></tr>`

    const total = Number(q.total) || 0, paid = qPaid(q), pct = total ? Math.round(paid / total * 100) : 0
    const expired = Q_OPEN.includes(q.estado) && q.validez && q.validez < todayISO()
    const ord = q.orderId ? getOrders().find(o => o.id === q.orderId) : null
    const items = (q.items || []).map(i => i.desc).filter(Boolean)
    return `<tr onclick="openQuoteDetailFull('${q.id}')">
      <td style="min-width:170px"><span class="code">${esc(q.code || '—')}</span><div class="muted" style="margin-top:2px">${q.fecha ? shortDate(q.fecha) : '—'}${items.length ? ' · ' + esc(items.slice(0, 2).join(', ')) + (items.length > 2 ? '…' : '') : ''}</div></td>

        ${expired ? `<div style="margin-top:4px"><span class="pill red">Venció ${shortDate(q.validez)}</span></div>` : q.validez && Q_OPEN.includes(q.estado) ? `<div class="muted" style="font-size:12px;margin-top:4px">Vence ${shortDate(q.validez)}</div>` : ''}
      </td>
      <td class="r" style="font-weight:600;white-space:nowrap">${usd(total, true)}</td>
      <td style="min-width:110px">${paid ? `<div style="font-size:13px;font-weight:600">${usd(paid)}</div><div class="bar" style="height:6px;margin-top:5px"><div style="width:${Math.min(100, pct)}%;background:var(--green)"></div></div>` : '<span class="muted">—</span>'}</td>
      <td style="white-space:nowrap" onclick="stop(event)">${ord ? `<button type="button" class="code" style="border:0;background:none;padding:0;cursor:pointer;color:var(--blue)" onclick="openDetail('${ord.id}')">${esc(ord.code)}</button>` : q.estado === 'aprobado' ? `<button type="button" class="btn btn-sm btn-primary" onclick="convertQuoteToOrder('${q.id}')">Crear orden</button>` : '<span class="muted">—</span>'}</td>
      <td class="r" onclick="stop(event)"><button type="button" class="btn btn-sm" onclick="openEditQuote('${q.id}')">Editar</button></td>

/* ── Proveedores ── */
let suppliersFolder = 'todas', suppliersSearch = ''
function supplierPerf(nombre) {
  // Desvío de costo y atraso promedio de sus órdenes entregadas (mismo criterio que Estimado vs. real).
  const os = getOrders().filter(o => o.proveedor === nombre && (o._valoresReales || o.estado === 'entregado'))
  const desv = [], atr = []
  os.forEach(o => {
    const q = quoteOf(o), est = Number(o._estimado?.landed) || 0, real = o._valoresReales ? Number(q?.landedTotal ?? o._landedTotal) || 0 : 0
    if (est && real) desv.push((real - est) / est * 100)
    if (o._eta_original && o.fecha_entrega) atr.push(daysBetween(o._eta_original, o.fecha_entrega))
  })
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null
  return { desv: avg(desv), atr: avg(atr) }
}
function suppliersRowsHtml() {
  const folders = getSupplierFolders(), orders = getOrders()
  const s = suppliersSearch.trim().toLowerCase()
  const list = getSuppliers().filter(x => suppliersFolder === 'todas' ? true : suppliersFolder === 'sin' ? (!x.folderId || !folders.some(f => f.id === x.folderId)) : x.folderId === suppliersFolder)
    .filter(x => !s || [x.nombre, x.apodo, x.ciudad, x.cat, x.contacto].some(v => (v || '').toLowerCase().includes(s)))
    .sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''))
  if (!list.length) return `<tr style="cursor:default"><td colspan="7" class="muted" style="padding:28px;text-align:center">${suppliersSearch ? 'Ningún proveedor coincide con la búsqueda.' : 'No hay proveedores en esta carpeta.'}</td></tr>`

    const so = orders.filter(o => o.proveedor === x.nombre), act = so.filter(o => DQ_ACTIVE.includes(o.estado))
    const fob = so.reduce((t, o) => t + (Number(o.fob_total) || 0), 0)

    const perf = p.desv === null && p.atr === null ? '<span class="muted">Sin datos aún</span>'

    const last = (x.comments || []).slice(-1)[0]
    return `<tr onclick="editSupplier('${x.id}')">
      <td style="min-width:220px"><div style="font-weight:600">${esc(x.nombre)}</div><div class="muted">${esc([x.apodo, x.ciudad].filter(Boolean).join(' · ') || '—')}</div>${last ? `<div class="muted" style="font-size:12px;margin-top:3px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(last.txt || '')}">Nota: ${esc(last.txt || '')}</div>` : ''}</td>
      <td class="muted">${esc(x.cat || '—')}</td>
      <td style="white-space:nowrap">${x.leadtime ? esc(x.leadtime) + ' días' : '<span class="muted">—</span>'}</td>
      <td>${so.length}${act.length ? ` <span class="pill blue" style="margin-left:4px">${act.length} en curso</span>` : ''}</td>
      <td class="r" style="font-weight:600;white-space:nowrap">${fob ? usd(fob) : '<span class="muted">—</span>'}</td>
      <td style="white-space:nowrap">${perf}</td>
      <td onclick="stop(event)"><label class="sr" for="sf-${x.id}">Carpeta de ${esc(x.nombre)}</label><select id="sf-${x.id}" class="select" style="width:auto;min-height:34px;padding:4px 8px;font-size:13px" onchange="assignSupplierFolder('${x.id}',this.value)"><option value="">Sin carpeta</option>${folders.map(f => `<option value="${f.id}" ${x.folderId === f.id ? 'selected' : ''}>${esc(f.nombre)}</option>`).join('')}</select></td>

const ALL_SECTIONS = [
  ['dashboard','📊 Dashboard'],['dataquality','🧹 Datos a completar'],['calendar','📅 Calendario'],['folders','📁 Carpetas'],
  ['orders','📦 Órdenes'],['tracking','🚢 Tracking'],['costs','💰 Costos'],['calc','🧮 Calculadora'],
  ['cashflow','📈 Flujo de caja'],['analysis','🎯 Estimado vs. real'],['products','🏷️ Productos'],
  ['clients','👥 Clientes'],['quotes','📋 Presupuestos'],['suppliers','🏭 Proveedores'],['companies','🏢 Empresas']
]

let currentUser = null

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
}

function userCanSee(section) {
  if (!currentUser) return false
  if (currentUser.rol === 'admin' || currentUser.secciones === 'all') return true
  if (section === 'users') return false
  return (currentUser.secciones || []).includes(section)
}

function userCanSeeCompany(companyId) {
  if (!currentUser) return false
  if (currentUser.rol === 'admin' || currentUser.empresas === 'all') return true
  return (currentUser.empresas || []).includes(companyId)
}

function downloadJson(obj, filename) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }))
  const a = document.createElement('a'); a.href = url; a.download = filename
  document.body.appendChild(a); a.click(); a.remove()
  setTimeout(() => URL.revokeObjectURL(url), 5000)
}

async function runMigration() {
  const fb = window._fb, { fs } = fb
  const btn = document.getElementById('mig-btn'), msg = document.getElementById('mig-msg')
  const step = t => { msg.style.color = '#3f3f38'; msg.textContent = t }
  btn.disabled = true; btn.textContent = 'Actualizando…'
  try {
    step('Leyendo los datos actuales…')
    const legacy = {}
    const snap = await fs.getDocs(fs.collection(fb.db, 'crm'))
    snap.forEach(d => { try { legacy[d.id] = JSON.parse(d.data().data) } catch {} })

    step('Descargando el respaldo…')
    downloadJson(legacy, `importcrm-respaldo-${new Date().toISOString().slice(0,10)}.json`)

    // Archivos: salen de adentro de la orden a la colección "files".
    const orders = (legacy.orders || []).map(o => ({ ...o, archivos: (o.archivos || []).map(f => ({ ...f })) }))
    const total = orders.reduce((s, o) => s + o.archivos.filter(f => f.data).length, 0)
    let n = 0
    for (const o of orders) for (const f of o.archivos) {
      if (!f.data) continue
      step(`Pasando archivos (${++n} de ${total})…`)
      f.fileId = await storeFile(f.data, { companyId: o.companyId ?? null, orderId: o.id, nombre: f.nombre || 'archivo', ext: f.ext || '', size: f.size || '' })
      if (!f.id) f.id = f.fileId
      delete f.data
    }
    legacy.orders = orders

    const counts = {}
    for (const name of Object.keys(COLLS)) {
      const items = (legacy[name] || []).filter(x => x && x.id)
      counts[name] = items.length
      step(`Pasando ${name} (${items.length})…`)
      for (let i = 0; i < items.length; i += 400) {
        const b = fs.writeBatch(fb.db)
        items.slice(i, i + 400).forEach((item, j) => {
          const payload = { data: JSON.stringify(item), pos: i + j, updatedAt: Date.now(), updatedBy: currentUser.email }
          if (COLLS[name].company) payload.companyId = item.companyId ?? null
          b.set(fs.doc(fb.db, name, item.id), payload)
        })
        await b.commit()
      }
    }

    step('Pasando los ajustes…')
    const b = fs.writeBatch(fb.db)
    for (const [k, v] of Object.entries(legacy)) {
      if (COLLS[k] || k === 'currentCompany' || k === 'session_user') continue
      b.set(fs.doc(fb.db, 'settings', k), { data: JSON.stringify(v ?? null), updatedAt: Date.now(), updatedBy: currentUser.email })
    }
    // Va último: hasta que exista, nadie usa el formato nuevo.
    b.set(fs.doc(fb.db, 'settings', 'migration'), {
      data: JSON.stringify({ version: 1, at: new Date().toISOString(), by: currentUser.email, counts, files: total }),
      updatedAt: Date.now(), updatedBy: currentUser.email })
    await b.commit()

    step('¡Listo! Entrando…')
    setTimeout(() => location.reload(), 800)
  } catch (e) {
    console.error('Error en la migración', e)
    btn.disabled = false; btn.textContent = 'Reintentar'
    msg.style.color = '#DC2626'
    msg.textContent = 'No se pudo completar: ' + (e?.code || e?.message || e) + '. Tus datos actuales no se tocaron; podés reintentar.'
  }
}

  }).join('') || '<p class="text-muted" style="font-size:12px">Sin usuarios.</p>'
}

function openUserModal(email, legacyIdx) {
  const editUser = email ? _accessList.find(u => u.email === email) : (legacyIdx != null ? getLegacyUsers()[legacyIdx] : null)
  const isEdit = !!email
  const isMe = isEdit && email === currentUser.email
  const companies = getCompanies()
  let el = document.getElementById('modal-user')
  if (!el) { el = document.createElement('div'); el.id='modal-user'; el.className='modal-overlay'; el.onclick=e=>{if(e.target===el)el.classList.remove('open')}; document.body.appendChild(el) }
  const uEmpresas = editUser?.empresas || 'all'
  const uSecciones = editUser?.secciones || 'all'
  const empresasAll = uEmpresas === 'all'
  const seccionesAll = uSecciones === 'all'
  const empInc = (id) => !empresasAll && Array.isArray(uEmpresas) && uEmpresas.includes(id)
  const secInc = (k) => !seccionesAll && Array.isArray(uSecciones) && uSecciones.includes(k)
  el.innerHTML = `<div class="modal modal-sm">
    <div class="modal-header"><span class="modal-title">${isEdit?'Editar usuario':legacyIdx!=null?'Migrar usuario':'Nuevo usuario'}</span><button class="modal-close" onclick="document.getElementById('modal-user').classList.remove('open')">✕</button></div>
    <div class="form-row mb12">
      <div class="form-group"><label class="label">Nombre</label><input class="input" id="u-nombre" value="${esc(editUser?.nombre||'')}" placeholder="Juan Pérez"/></div>
      <div class="form-group"><label class="label">Email <span class="req">*</span></label><input class="input" id="u-email" type="email" value="${esc(isEdit?email:'')}" ${isEdit?'disabled':''} placeholder="juan@empresa.com"/></div>
    </div>
    ${isEdit?'':`<p style="font-size:12px;color:var(--text2);margin:-4px 0 12px">Le va a llegar un email para que elija su contraseña.</p>`}
    <div class="form-group mb12"><label class="label">Rol</label>
      <select class="select" id="u-rol" onchange="toggleUserRolFields()" ${isMe?'disabled title="No podés cambiar tu propio rol"':''}>
        <option value="user" ${editUser?.rol!=='admin'?'selected':''}>Usuario</option>
        <option value="admin" ${editUser?.rol==='admin'?'selected':''}>Administrador (ve todo)</option>
      </select>
    </div>
    <div id="u-permisos" style="${editUser?.rol==='admin'?'display:none':''}">
      <hr class="divider"/>
      <div class="section-title mb8">🏢 Empresas que puede ver</div>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer">
        <input type="checkbox" id="u-emp-all" ${empresasAll?'checked':''} onchange="toggleEmpAll()"/>
        <span style="font-size:13px;font-weight:600">Todas las empresas</span>
      </label>
      <div id="u-emp-list" style="${empresasAll?'opacity:.4;pointer-events:none':''};display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px">
        ${companies.map(c=>`<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" class="u-emp-check" value="${esc(c.id)}" ${empInc(c.id)?'checked':''}/>${esc(c.nombre)}</label>`).join('')}
      </div>
      <div class="section-title mb8">🔑 Secciones que puede ver</div>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer">
        <input type="checkbox" id="u-sec-all" ${seccionesAll?'checked':''} onchange="toggleSecAll()"/>
        <span style="font-size:13px;font-weight:600">Acceso completo</span>
      </label>
      <div id="u-sec-list" style="${seccionesAll?'opacity:.4;pointer-events:none':''};display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px">
        ${ALL_SECTIONS.map(([k,l])=>`<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" class="u-sec-check" value="${k}" ${secInc(k)?'checked':''}/>${l}</label>`).join('')}
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="document.getElementById('modal-user').classList.remove('open')">Cancelar</button>
      <button class="btn btn-primary" id="u-save-btn" onclick="saveUser(${isEdit?`'${esc(email)}'`:'null'}, ${legacyIdx ?? 'null'})">Guardar</button>
    </div>
  </div>`
  el.classList.add('open')
}

function toggleUserRolFields() { document.getElementById('u-permisos').style.display = document.getElementById('u-rol').value === 'admin' ? 'none' : '' }
function toggleEmpAll() { const all = document.getElementById('u-emp-all').checked; const l = document.getElementById('u-emp-list'); l.style.opacity = all?'.4':'1'; l.style.pointerEvents = all?'none':'auto' }
function toggleSecAll() { const all = document.getElementById('u-sec-all').checked; const l = document.getElementById('u-sec-list'); l.style.opacity = all?'.4':'1'; l.style.pointerEvents = all?'none':'auto' }

// Crea la cuenta de Firebase Auth con una contraseña al azar que nadie conoce,
// usando una instancia aparte para no cerrar la sesión del admin.
async function createAuthAccount(email) {
  const { appMod, au } = window._fb
  const sec = appMod.initializeApp(FB_CONFIG, 'alta-' + Date.now())
  try {
    const sAuth = au.initializeAuth(sec, { persistence: au.inMemoryPersistence })
    const bytes = crypto.getRandomValues(new Uint8Array(24))
    const pwd = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('') + 'Aa1!'
    await au.createUserWithEmailAndPassword(sAuth, email, pwd)
    await au.signOut(sAuth).catch(() => {})
    return 'created'
  } catch (e) {
    if (e?.code === 'auth/email-already-in-use') return 'exists'
    console.error(e); return 'error:' + (e?.code || e?.message)
  } finally {
    appMod.deleteApp(sec).catch(() => {})
  }
}

async function saveUser(editEmail, legacyIdx) {
  const fb = window._fb
  const email = (editEmail || document.getElementById('u-email').value).trim().toLowerCase()
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert('Ingresá un email válido')
  const rol = editEmail === currentUser.email ? 'admin' : document.getElementById('u-rol').value
  let empresas = 'all', secciones = 'all'
  if (rol !== 'admin') {
    empresas = document.getElementById('u-emp-all').checked ? 'all' : Array.from(document.querySelectorAll('.u-emp-check:checked')).map(c=>c.value)
    secciones = document.getElementById('u-sec-all').checked ? 'all' : Array.from(document.querySelectorAll('.u-sec-check:checked')).map(c=>c.value)
  }
  const data = { nombre: document.getElementById('u-nombre').value.trim(), rol, empresas, secciones }
  if (!editEmail && _accessList.some(u => u.email === email)) return alert('Ese email ya tiene acceso')

  const btn = document.getElementById('u-save-btn'); btn.disabled = true; btn.textContent = 'Guardando...'
  try {
    await fb.fs.setDoc(fb.fs.doc(fb.db, 'access', email), data, { merge: true })
  } catch (e) {
    console.error(e); btn.disabled = false; btn.textContent = 'Guardar'
    return alert('No se pudo guardar el usuario: ' + (e?.code || e?.message))
  }

  if (!editEmail) {
    const r = await createAuthAccount(email)
    if (r === 'created') {
      await fb.au.sendPasswordResetEmail(fb.auth, email).catch(console.error)
      toast('Usuario creado ✓ Le enviamos un email para elegir su contraseña')
    } else if (r === 'exists') {
      toast('Acceso habilitado ✓ (esa cuenta ya existía)')
    } else {
      alert(`El permiso quedó guardado, pero no se pudo crear la cuenta (${r.slice(6)}).\n\nCreala a mano en la consola de Firebase: Authentication → Users → Add user, con el email ${email}. Después tocá "Enviar link de contraseña" en su tarjeta.`)
    }
    if (legacyIdx != null) {
      const legacy = getLegacyUsers(); legacy.splice(legacyIdx, 1); saveLegacyUsers(legacy)
    }
  } else {
    toast('Usuario actualizado ✓')
  }
  document.getElementById('modal-user').classList.remove('open')
  renderPage()
}

async function resetUserPassword(email) {
  try {
    await window._fb.au.sendPasswordResetEmail(window._fb.auth, email)
    toast('Link enviado a ' + email)
  } catch (e) { console.error(e); alert('No se pudo enviar el email: ' + (e?.code || e?.message)) }
}

async function deleteUser(email) {
  if (email === currentUser.email) return
  if (!confirm(`¿Quitarle el acceso a ${email}?`)) return
  const fb = window._fb
  try {
    await fb.fs.deleteDoc(fb.fs.doc(fb.db, 'access', email))
    toast('Acceso quitado'); renderPage()
  } catch (e) { console.error(e); alert('No se pudo quitar el acceso: ' + (e?.code || e?.message)) }
}

function discardLegacyUser(idx) {
  const legacy = getLegacyUsers()
  const u = legacy[idx]; if (!u) return
  if (!confirm(`¿Descartar a "${u.username}" del sistema anterior? No se le crea acceso nuevo.`)) return
  legacy.splice(idx, 1); saveLegacyUsers(legacy)
  renderPage()
}


/* ════════════════════════════════════
   INIT — se llama desde onAuthChange cuando el usuario tiene acceso
════════════════════════════════════ */
let currentCompanyId = null

function _startApp() {
  // El sistema anterior guardaba contraseñas en texto plano: se borran.
  if (currentUser.rol === 'admin') stripLegacyPasswords()
  try { sessionStorage.removeItem('icrm_session') } catch {}

  const visibleCompanies = getCompanies().filter(c=>userCanSeeCompany(c.id))
  try { currentCompanyId = localStorage.getItem('icrm_company') } catch {}
  if (!currentCompanyId || !userCanSeeCompany(currentCompanyId)) currentCompanyId = visibleCompanies[0]?.id

  backfillTracking()
  renderCompanySelector()
  applyUserPermissions()
  const firstVisible = ALL_SECTIONS.find(([k])=>userCanSee(k))
  if (firstVisible) { nav(firstVisible[0]) } else { renderPage() }
}

document.getElementById('content').innerHTML = `
  <div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:16px">
    <div style="width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite"></div>
    <div style="font-size:13px;color:var(--text2)">Conectando con Firebase...</div>
  </div>`
</script>
