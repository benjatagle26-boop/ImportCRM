<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ImportCRM v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

:root {
  --bg:#F4F3EE; --surface:#FFFFFF; --surface2:#EEEDE6; --surface3:#E5E4DB;
  --border:rgba(0,0,0,0.09); --border2:rgba(0,0,0,0.16);
  --text:#18180F; --text2:#5C5C51; --text3:#7A7A6E;
  --ink:#18180F;
  --blue:#2563EB; --blue-bg:#EEF3FF; --blue-t:#1D4ED8;
  --green:#16A34A; --green-bg:#F0FDF4; --green-t:#15803D;
  --amber:#D97706; --amber-bg:#FFFBEB; --amber-t:#92400E;
  --red:#DC2626; --red-bg:#FEF2F2; --red-t:#991B1B;
  --purple:#7C3AED; --purple-bg:#F5F3FF; --purple-t:#5B21B6;
  --pink:#DB2777; --pink-bg:#FDF2F8; --pink-t:#9D174D;
  --teal:#0D9488; --teal-bg:#F0FDFA; --teal-t:#0F766E;
  --r:6px; --rl:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,.12);
  --font:'IBM Plex Sans',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sidebar:220px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5}

/* ═══ LAYOUT ═══ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-logo{padding:16px;border-bottom:1px solid var(--border)}
.logo-mark{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.5px;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px;text-transform:uppercase;letter-spacing:.8px}
.sidebar-section{padding:12px 8px 4px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding-left:14px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text2);border-left:2px solid transparent;transition:all .1s;user-select:none;border-radius:0}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);border-left-color:var(--blue);font-weight:600}
.nav-badge{margin-left:auto;background:var(--surface3);color:var(--text2);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;font-family:var(--mono)}

.company-selector{padding:10px 12px;border-bottom:1px solid var(--border)}
.company-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);cursor:pointer;font-size:12px;font-weight:600;width:100%;transition:all .1s}
.company-btn:hover{background:var(--surface3)}
.company-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.company-name{flex:1;text-align:left;font-family:var(--mono);font-size:11px}
.company-chevron{color:var(--text3);font-size:10px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.page-title{font-size:15px;font-weight:700;flex:1;letter-spacing:-.3px}
.content{flex:1;overflow-y:auto;padding:20px}

/* ═══ BUTTONS ═══ */
.btn{padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:all .1s;line-height:1;display:inline-flex;align-items:center;gap:5px;font-family:var(--font);white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-t)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--surface2)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-xs{padding:2px 7px;font-size:10px}
.btn-danger{background:var(--red-bg);color:var(--red-t);border-color:#fca5a5}
.btn-success{background:var(--green-bg);color:var(--green-t);border-color:#86efac}
.btn-amber{background:var(--amber-bg);color:var(--amber-t);border-color:#fcd34d}

/* ═══ INPUTS ═══ */
.input,.select,.textarea{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--text);font-family:var(--font);transition:border .1s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.textarea{resize:vertical;min-height:60px}
.label{font-size:11px;color:var(--text2);margin-bottom:3px;display:block;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.req{color:var(--red)}
.form-hint{font-size:10px;color:var(--text3);margin-top:3px}
.form-group{display:flex;flex-direction:column;gap:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}

/* ═══ CARDS ═══ */
.card{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);box-shadow:var(--shadow);padding:16px 18px}
.card-flat{background:var(--surface2);border-radius:var(--r);padding:12px 14px}
.card-section{margin-bottom:16px}

/* ═══ KPI ═══ */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--shadow)}
.kpi.clickable{cursor:pointer;transition:box-shadow .15s,transform .15s}
.kpi.clickable:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.kpi-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px;line-height:1.1;white-space:nowrap}
.kpi-sub{font-size:12px;color:var(--text3);margin-top:5px}
.kpi-sub.pos{color:var(--green-t)}
.kpi-sub.warn{color:var(--amber-t)}
.kpi-sub.neg{color:var(--red-t)}

/* ═══ TABLE ═══ */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-size:12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border2);background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
td.money,td .money{white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2);cursor:pointer}
.td-sm{font-size:12px;color:var(--text2)}
.td-mono{font-family:var(--mono);font-size:12px}

/* ═══ BADGES ═══ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;font-family:var(--mono)}
.badge-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-muestra{background:#F5F3FF;color:#5B21B6}
.b-cotizacion{background:var(--surface2);color:var(--text2)}
.b-pedido{background:var(--purple-bg);color:var(--purple-t)}
.b-produccion{background:var(--amber-bg);color:var(--amber-t)}
.b-transito{background:var(--blue-bg);color:var(--blue-t)}
.b-aduana{background:var(--pink-bg);color:var(--pink-t)}
.b-entregado{background:var(--green-bg);color:var(--green-t)}
.dot-muestra{background:var(--purple)}
.dot-cotizacion{background:#888}
.dot-pedido{background:var(--purple)}
.dot-produccion{background:var(--amber)}
.dot-transito{background:var(--blue)}
.dot-aduana{background:var(--pink)}
.dot-entregado{background:var(--green)}
/* client quote badges */
.b-borrador{background:var(--surface2);color:var(--text2)}
.b-enviado{background:var(--blue-bg);color:var(--blue-t)}
.b-aprobado{background:var(--green-bg);color:var(--green-t)}
.b-rechazado{background:var(--red-bg);color:var(--red-t)}

/* ═══ PROGRESS ═══ */
.prog-bar{height:4px;background:var(--surface3);border-radius:2px;width:80px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue);border-radius:2px}

/* ═══ MODAL ═══ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border2);width:100%;max-width:760px;padding:24px;margin:auto;box-shadow:var(--shadow-lg)}
.modal-sm{max-width:500px}
.modal-lg{max-width:920px}
.modal-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700;flex:1;letter-spacing:-.3px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);padding:0;line-height:1;font-family:var(--font)}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}

/* ═══ STEPPER ═══ */
.stepper{display:flex;align-items:flex-start;margin-bottom:22px}
.step-wrap{display:flex;align-items:center;flex:1}
.step-wrap:last-child{flex:none}
.step-node{display:flex;flex-direction:column;align-items:center;gap:4px}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--border2);background:var(--surface);color:var(--text2);flex-shrink:0;transition:all .2s;font-family:var(--mono)}
.step-circle.done{background:var(--blue);border-color:var(--blue);color:#fff}
.step-circle.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.step-label{font-size:9px;color:var(--text3);text-align:center;max-width:70px;line-height:1.3;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.step-label.active{color:var(--blue-t)}
.step-line{flex:1;height:2px;background:var(--border2);margin:0 4px;margin-top:-18px;transition:background .2s}
.step-line.done{background:var(--blue)}

/* ═══ TABS ═══ */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;gap:0}
.tab{padding:7px 14px;font-size:12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .1s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* ═══ TIMELINE ═══ */
.tl{display:flex;flex-direction:column}
.tl-item{display:flex;gap:12px}
.tl-left{display:flex;flex-direction:column;align-items:center}
.tl-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0}
.tl-dot.done{background:var(--blue)}
.tl-dot.active{background:var(--amber);border:2px solid var(--amber-t);width:11px;height:11px;margin-top:3px}
.tl-dot.pending{background:var(--border2)}
.tl-line{width:1px;flex:1;background:var(--border);min-height:16px;margin:3px 0}
.tl-body{flex:1;padding-bottom:14px}
.tl-name{font-size:13px;font-weight:600}
.tl-date{font-size:11px;color:var(--text2);margin-top:1px;font-family:var(--mono)}
.tl-note{font-size:11px;color:var(--text2);margin-top:3px;font-style:italic}

/* ═══ PAYMENT ROWS ═══ */
.pago-row{display:grid;grid-template-columns:110px 1fr 120px 100px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.pago-row:last-child{border-bottom:none}
.pago-tipo-tag{font-size:10px;font-weight:700;font-family:var(--mono);padding:2px 7px;border-radius:4px;background:var(--blue-bg);color:var(--blue-t);text-transform:uppercase}
.pago-monto{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--text)}
.pago-saldo-bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:4px}
.pago-saldo-fill{height:100%;border-radius:3px;background:var(--green)}

/* ═══ CONTAINER ROWS ═══ */
.cont-row{display:grid;grid-template-columns:130px 1fr 120px 90px 90px auto;gap:8px;align-items:center;padding:10px;background:var(--surface2);border-radius:var(--r);margin-bottom:6px}
.cont-num{font-family:var(--mono);font-size:12px;font-weight:600}

/* ═══ COST BREAKDOWN ═══ */
.cost-block{background:var(--surface2);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.cost-block-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px;font-family:var(--mono)}
.cost-line{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)}
.cost-line:last-child{border-bottom:none}
.cost-total-line{display:flex;justify-content:space-between;padding:10px 0 4px;font-size:15px;font-weight:700;border-top:2px solid var(--border2);margin-top:6px}
.cost-total-val{color:var(--blue-t);font-family:var(--mono)}

/* ═══ FILE ATTACHMENTS ═══ */
.file-drop{border:2px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .1s;background:var(--surface2)}
.file-drop:hover,.file-drop.dragover{border-color:var(--blue);background:var(--blue-bg)}
.file-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:var(--r);margin-bottom:6px}
.file-icon{font-size:18px;flex-shrink:0}
.file-name{font-size:12px;font-weight:600;flex:1;font-family:var(--mono)}
.file-size{font-size:11px;color:var(--text3)}

/* ═══ COMPANY DROPDOWN ═══ */
.company-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:200;overflow:hidden;margin-top:4px}
.company-option{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px}
.company-option:hover{background:var(--surface2)}

/* ═══ FILTER CHIPS ═══ */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:4px 11px;font-size:11px;border-radius:4px;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text2);transition:all .1s;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:.3px}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.active{background:var(--blue-bg);color:var(--blue-t);border-color:var(--blue)}

/* ═══ SEARCH ═══ */
.search{padding:6px 12px;font-size:13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--surface2);color:var(--text);font-family:var(--font);width:200px}
.search:focus{outline:none;border-color:var(--blue);background:var(--surface)}

/* ═══ STAGE BANNER ═══ */
.stage-banner{background:var(--blue-bg);border:1px solid #BFDBFE;border-radius:var(--r);padding:11px 13px;margin-bottom:14px}
.stage-banner.green{background:var(--green-bg);border-color:#BBF7D0}
.stage-banner.amber{background:var(--amber-bg);border-color:#FDE68A}
.stage-banner-title{font-size:12px;font-weight:700;color:var(--blue-t);margin-bottom:2px}
.stage-banner.green .stage-banner-title{color:var(--green-t)}
.stage-banner.amber .stage-banner-title{color:var(--amber-t)}
.stage-banner-desc{font-size:11px;color:var(--blue-t);opacity:.8}
.stage-banner.green .stage-banner-desc{color:var(--green-t)}

/* ═══ SUPPLIER / CLIENT CARDS ═══ */
.entity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.entity-card{cursor:pointer;transition:border .1s}
.entity-card:hover{border-color:var(--blue)}
.entity-avatar{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-family:var(--mono);flex-shrink:0}
.entity-add{border:1.5px dashed var(--border2)!important;display:flex;align-items:center;justify-content:center;min-height:110px;flex-direction:column;gap:6px;color:var(--text3);cursor:pointer;background:transparent!important}
.entity-add:hover{border-color:var(--blue)!important;color:var(--blue)}

/* ═══ QUOTE / BUDGET ═══ */
.quote-card{cursor:pointer;transition:border .1s;margin-bottom:10px}
.quote-card:hover{border-color:var(--blue)}
.quote-item-row{display:grid;grid-template-columns:2fr 80px 90px 90px 32px;gap:8px;align-items:center}
.quote-item-header{display:grid;grid-template-columns:2fr 80px 90px 90px 32px;gap:8px;margin-bottom:4px}

/* ═══ EMPTY ═══ */
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-title{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:5px}
.empty-desc{font-size:12px}

/* ═══ ARRIVAL ITEM ═══ */
.arrival-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.arrival-item:last-child{border-bottom:none}

/* ═══ TOAST ═══ */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;font-family:var(--mono)}
#toast.show{opacity:1}

/* ═══ SHIP VIZ ═══ */
.ship-viz{background:linear-gradient(135deg,#DBEAFE,#EDE9FE);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;height:76px;display:flex;align-items:center;margin-bottom:12px}
.ship-line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:rgba(37,99,235,.2)}

/* ═══ MISC ═══ */
.section-title{font-size:13px;font-weight:700;letter-spacing:-.2px;color:var(--text)}
.section-sub{font-size:11px;color:var(--text3)}
.dot-sep{color:var(--text3);margin:0 4px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--mono);background:var(--surface2);color:var(--text2);text-transform:uppercase}
.mono{font-family:var(--mono)}
.money{font-family:var(--mono);font-weight:700;white-space:nowrap}
.text-blue{color:var(--blue-t)}
.text-green{color:var(--green-t)}
.text-amber{color:var(--amber-t)}
.text-red{color:var(--red-t)}
.text-muted{color:var(--text3)}
.mb4{margin-bottom:4px}
.mb8{margin-bottom:8px}
.mb12{margin-bottom:12px}
.mb16{margin-bottom:16px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap4{gap:4px}
.gap8{gap:8px}
.gap12{gap:12px}

/* ════════════════════════════════════
   REDISEÑO — capa visual sobre los estilos anteriores
   Fondo gris claro, Inter con números tabulares, un solo azul de acento,
   estados con color + texto, controles de 40–44 px.
════════════════════════════════════ */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#F9FAFB; --surface3:#EEF0F3;
  --border:#E3E5EA; --border2:#D0D5DD;
  --text:#101828; --text2:#475467; --text3:#5D6679; --ink:#101828;
  --blue:#1F4FD1; --blue-bg:#E8EEFC; --blue-t:#1F4FD1;
  --green:#067647; --green-bg:#ECFDF3; --green-t:#067647;
  --amber:#B54708; --amber-bg:#FEF3E2; --amber-t:#9A4A07;
  --red:#B42318; --red-bg:#FEF0EE; --red-t:#B42318;
  --teal:#0E7490; --teal-bg:#EEFAFC; --teal-t:#0E7490;
  --r:8px; --rl:12px;
  --shadow:none; --shadow-lg:0 12px 32px rgba(16,24,40,.14);
  --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --sidebar:248px;
}
body{font-family:var(--font);font-size:14px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--bg)}
.money{font-family:var(--font);font-variant-numeric:tabular-nums}

/* Menú lateral */
.sidebar{padding:18px 14px;gap:2px}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;border-bottom:0}
.logo-icon{width:30px;height:30px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark{font-family:var(--font);font-size:16px;font-weight:700;letter-spacing:-.2px}
.company-selector{padding:0 0 14px;border-bottom:0}
.company-btn{min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font:inherit;font-size:13px;color:var(--text);text-align:left;padding:8px 10px}
.company-name{font-family:var(--font);font-size:13px;font-weight:600}
.company-chevron{color:var(--text3);flex-shrink:0}
.sidebar-section{padding:18px 12px 6px;font-size:12px;font-weight:600;color:var(--text3);text-transform:none;letter-spacing:0}
.nav-item{width:100%;min-height:42px;border:0;border-left:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#344054;text-align:left;padding:0 12px;border-radius:8px;gap:10px}
.nav-item svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item span:first-of-type{flex:1}
.nav-item:hover{background:var(--surface3);color:var(--text)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:600}
.nav-item:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nav-count{font-size:11px;font-weight:700;color:var(--amber-t);background:var(--amber-bg);border-radius:10px;padding:2px 8px}
#user-info-box{border-top:1px solid var(--border)!important;padding:12px 8px 0!important;margin-top:auto}

/* Barra superior y contenido */
.topbar{padding:14px 32px;border-bottom:1px solid var(--border)}
.page-title{font-size:18px;font-weight:700}
.content{padding:28px 32px 56px}
.search{height:40px;border-radius:10px;background:var(--surface);width:260px}

/* Botones, campos y etiquetas */
.btn{min-height:40px;padding:0 14px;font-size:13px;border-radius:8px;border-color:var(--border2);font-family:var(--font)}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px}
.btn-xs{min-height:30px;padding:0 9px;font-size:12px}
.btn-primary{background:var(--blue);border-color:var(--blue)}
.btn-primary:hover{background:#163BA3}
.btn-danger{background:var(--red-bg);color:var(--red-t);border-color:#F7C1BB}
.input,.select,.textarea{min-height:40px;padding:8px 12px;font-size:14px;border-radius:8px;border-color:var(--border2)}
.input:focus,.select:focus,.textarea:focus{box-shadow:0 0 0 3px rgba(31,79,209,.15)}
.label{font-size:13px;font-weight:500;color:#344054;text-transform:none;letter-spacing:0;margin-bottom:5px}
.form-hint{font-size:12px}

/* Tarjetas, estados y filtros */
.card{border-radius:12px;border-color:var(--border);box-shadow:none;padding:18px 20px}
.section-title{font-size:16px;font-weight:700}
.badge{font-family:var(--font);text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;border-radius:13px;padding:3px 10px;gap:6px}
.badge-dot{width:7px;height:7px}
.b-pedido{background:#F2F5FF;color:#1F4FD1}.dot-pedido{background:#1F4FD1}
.b-produccion{background:#F4F3FF;color:#5925DC}.dot-produccion{background:#7A5AF8}
.b-transito{background:var(--teal-bg);color:var(--teal-t)}.dot-transito{background:var(--teal)}
.b-aduana{background:#FFF7EB;color:#9A4A07}.dot-aduana{background:#B54708}
.b-entregado{background:var(--green-bg);color:var(--green-t)}.dot-entregado{background:var(--green)}
.chip{min-height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:20px;font-family:var(--font);text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:#344054;border-color:var(--border2)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .chip-n{font-size:12px;color:var(--text3)}
.chip.active .chip-n{color:#D0D5DD}
.tab{font-size:14px;padding:10px 14px;font-family:var(--font);text-transform:none;letter-spacing:0;font-weight:500;min-height:44px}
.tab.active{font-weight:600}
.modal{border-radius:14px}
.tag{font-family:var(--font);text-transform:none;font-size:12px;border-radius:12px}

/* Piezas nuevas */
.pg-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.pg-head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.4px}
.pg-head p{margin:4px 0 0;font-size:14px;color:var(--text2)}
.pg-head .grow{flex:1 1 260px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.box-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:18px 20px 12px}
.box-h h2{margin:0;font-size:17px;font-weight:700}
.box-h .sub{font-size:13px;color:var(--text2)}
.metric{display:block;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:border-color .15s,box-shadow .15s}
.metric:hover{border-color:var(--border2);box-shadow:0 4px 12px rgba(16,24,40,.08)}
.metric .m-l{font-size:13px;font-weight:500;color:var(--text2)}
.metric .m-v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:6px;white-space:nowrap}
.metric .m-s{font-size:13px;color:var(--text2);margin-top:4px}
.grid-auto{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.red{background:var(--red-bg);color:var(--red-t)}.pill.amber{background:var(--amber-bg);color:var(--amber-t)}
.pill.green{background:var(--green-bg);color:var(--green-t)}.pill.blue{background:var(--blue-bg);color:var(--blue-t)}
.pill.gray{background:var(--surface3);color:var(--text2)}
.seg{display:inline-flex;padding:3px;background:#E9EBEF;border-radius:10px}
.seg button{height:38px;padding:0 14px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--surface2);font-size:12px;font-weight:600;color:var(--text2);padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid #EEF0F3;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}
.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl .r{text-align:right}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface2)}
.code{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}
.muted{color:var(--text2);font-size:13px}
.inbox-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid #EEF0F3;flex-wrap:wrap}
.inbox-ic{flex:0 0 36px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.inbox-ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inbox-ic.red{background:var(--red-bg);color:var(--red-t)}.inbox-ic.amber{background:var(--amber-bg);color:var(--amber-t)}.inbox-ic.blue{background:var(--blue-bg);color:var(--blue-t)}
.stage-card{display:block;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:10px;padding:12px 14px;border:1px solid var(--border)}
.dots{display:flex;gap:3px;margin-bottom:5px}.dots span{width:18px;height:6px;border-radius:3px;background:var(--border)}
.bar{height:8px;background:var(--surface3);border-radius:4px;overflow:hidden}.bar>div{height:100%;border-radius:4px}
.callout{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.5}
.callout.amber{background:#FFFBF2;border:1px solid #F5D9A8;color:#4A2504}
.callout.red{background:#FFF6F5;border:1px solid #F7C1BB;color:#55160C}
.callout svg{flex:0 0 20px;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps{list-style:none;margin:0;padding:16px 20px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.steps li{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:13px}
.steps .sb{height:6px;border-radius:3px;background:var(--border)}
.facts{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 20px}
.facts dt{font-size:12px;font-weight:500;color:var(--text3)}
.facts dd{margin:4px 0 0;font-size:15px;font-weight:600}
.two-col{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.two-col{grid-template-columns:minmax(0,1fr)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18l-2.5 5h-13z"/><path d="M6 15V9h12v6"/><path d="M12 9V4"/></svg></span>
      <span class="logo-mark">ImportCRM</span>
    </div>

    <!-- Selector de empresa -->
    <div class="company-selector" style="position:relative">
      <button type="button" class="company-btn" onclick="toggleCompanyDD()" aria-haspopup="listbox">
        <span class="company-dot" id="co-dot"></span>
        <span class="company-name" id="co-name">Cargando...</span>
        <svg class="company-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <div class="company-dropdown" id="co-dd" style="display:none"></div>
    </div>

    <button type="button" class="nav-item active" onclick="nav('dashboard')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Inicio</span><span id="dq-badge" class="nav-count" style="display:none"></span></button>
    <button type="button" class="nav-item" onclick="nav('orders')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg><span>Órdenes</span></button>
    <button type="button" class="nav-item" onclick="nav('cashflow')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/></svg><span>Pagos y caja</span></button>
    <button type="button" class="nav-item" onclick="nav('calc')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8"/><path d="M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg><span>Calculadora</span></button>

    <div class="sidebar-section">Comercial</div>
    <button type="button" class="nav-item" onclick="nav('quotes')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg><span>Presupuestos</span></button>
    <button type="button" class="nav-item" onclick="nav('clients')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.7c1.9.8 3.1 2.6 3.5 5.3"/></svg><span>Clientes</span></button>

    <div class="sidebar-section">Catálogo y análisis</div>
    <button type="button" class="nav-item" onclick="nav('suppliers')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V10l6 4V10l6 4V6l6 3v12z"/></svg><span>Proveedores</span></button>
    <button type="button" class="nav-item" onclick="nav('products')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Productos y NCM</span></button>
    <button type="button" class="nav-item" onclick="nav('analysis')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Estimado vs. real</span></button>
    <button type="button" class="nav-item" onclick="nav('companies')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5l8-2v18"/><path d="M12 9h8v12"/><path d="M8 8h.01M8 12h.01M8 16h.01M16 13h.01M16 17h.01"/></svg><span>Empresas</span></button>
  </nav>

  <div class="main">
    <div class="topbar">
      <span class="page-title" id="page-title">Dashboard</span>
      <input class="search" placeholder="Buscar..." oninput="handleSearch(this.value)" id="search-input"/>
      <button class="btn btn-primary btn-sm" id="topbar-action" onclick="topbarAction()">+ Nueva orden</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ══════════════════════════════════════
  MODAL: NUEVA / EDITAR ORDEN
══════════════════════════════════════ -->
<div class="modal-overlay" id="modal-order">
<div class="modal modal-lg">
  <div class="modal-header">
    <span class="modal-title" id="order-modal-title">Nueva orden</span>
    <button class="modal-close" onclick="closeModal('modal-order')">✕</button>
  </div>
  <div class="stepper" id="order-stepper"></div>
  <div id="order-step-content"></div>
</div>
</div>

<!-- MODAL: DETALLE ORDEN -->
<div class="modal-overlay" id="modal-detail">
<div class="modal modal-lg">
  <div class="modal-header">
    <div style="flex:1">
      <div class="modal-title" id="det-title"></div>
      <div id="det-meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px"></div>
    </div>
    <button class="modal-close" onclick="closeModal('modal-detail')">✕</button>
  </div>
  <div class="tabs" id="det-tabs"></div>
  <div id="det-body"></div>
  <hr class="divider"/>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn btn-danger btn-sm" onclick="deleteOrder()">Eliminar</button>
    <button class="btn btn-sm" onclick="editOrder()">Editar / Avanzar estado</button>
    <button class="btn btn-ghost btn-sm" onclick="closeModal('modal-detail')">Cerrar</button>
  </div>
</div>
</div>

<!-- MODAL: PAGO -->
<div class="modal-overlay" id="modal-pago">
<div class="modal modal-sm">
  <div class="modal-header">
    <span class="modal-title">Registrar pago</span>
    <button class="modal-close" onclick="closeModal('modal-pago')">✕</button>
  </div>
  <div class="form-row mb12">
    <div class="form-group">
      <label class="label">Tipo de pago</label>
      <select class="select" id="p-tipo">
        <option value="seña">Seña</option>
        <option value="saldo">Saldo / Pago final</option>
        <option value="parcial">Pago parcial</option>
        <option value="anticipo">Anticipo total</option>
        <option value="lc">Carta de crédito</option>
        <option value="contra-doc">Contra documentos</option>
      </select>
    </div>
    <div class="form-group">
      <label class="label">Fecha</label>
      <input class="input" type="date" id="p-fecha"/>
    </div>
  </div>
  <div class="form-row mb12">
    <div class="form-group">
      <label class="label">Monto (USD) <span class="req">*</span></label>
      <input class="input" type="number" id="p-monto" min="0" step="0.01" placeholder="0.00"/>
    </div>
    <div class="form-group">
      <label class="label">Referencia / Banco</label>
      <input class="input" id="p-ref" placeholder="Nro. transferencia, wire ref..."/>
    </div>
  </div>
  <div class="form-group mb16">
    <label class="label">Notas</label>
    <input class="input" id="p-notas" placeholder="Observaciones..."/>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn btn-ghost" onclick="closeModal('modal-pago')">Cancelar</button>
    <button class="btn btn-primary" onclick="savePago()">Registrar pago</button>
  </div>
</div>
</div>

<!-- MODAL: CONTENEDOR -->
<div class="modal-overlay" id="modal-cont">
<div class="modal modal-sm">
  <div class="modal-header">
    <span class="modal-title">Agregar contenedor</span>
    <button class="modal-close" onclick="closeModal('modal-cont')">✕</button>
  </div>
  <div class="form-row mb12">
    <div class="form-group">
      <label class="label">Tipo</label>
      <select class="select" id="ct-tipo">
        <option value="20GP">20' GP (25 CBM)</option>
        <option value="40GP">40' GP (55 CBM)</option>

    <button class="btn btn-primary" onclick="saveCont()">Agregar contenedor</button>
  </div>
</div>
</div>

<!-- MODAL: COSTO -->
<div class="modal-overlay" id="modal-costo">
<div class="modal modal-sm">
  <div class="modal-header">
    <span class="modal-title">Agregar costo</span>
    <button class="modal-close" onclick="closeModal('modal-costo')">✕</button>

  <div class="form-row mb12">
    <div class="form-group">
      <label class="label">Categoría <span class="req">*</span></label>

        <option value="impuesto">Impuestos / Aduana</option>
        <option value="otros">Otros gastos</option>
      </select>
    </div>
    <div class="form-group">
      <label class="label">Concepto <span class="req">*</span></label>
      <select class="select" id="c-concepto">
        <option value="flete">Flete marítimo</option>
        <option value="thc">THC origen + destino</option>
        <option value="seguro">Seguro</option>
        <option value="demurrage">Demurrage</option>
        <option value="otros-nav">Otros naviera</option>
      </select>
    </div>
  </div>
  <div class="form-row mb12">
    <div class="form-group">
      <label class="label">Monto (USD) <span class="req">*</span></label>
      <input class="input" type="number" id="c-monto" min="0" step="0.01" placeholder="0.00"/>
    </div>
    <div class="form-group">
      <label class="label">Fecha</label>
      <input class="input" type="date" id="c-fecha"/>
    </div>
  </div>
  <div class="form-group mb16">
    <label class="label">Nota</label>
    <input class="input" id="c-nota" placeholder="Referencia, proveedor, factura..."/>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn btn-ghost" onclick="closeModal('modal-costo')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveCosto()">Agregar costo</button>
  </div>
</div>
</div>

<!-- MODAL: SUPPLIER -->
<div class="modal-overlay" id="modal-supplier">
<div class="modal modal-sm">
  <div class="modal-header">
    <span class="modal-title">Proveedor</span>
    <button class="modal-close" onclick="closeModal('modal-supplier')">✕</button>
  </div>
  <div class="form-row mb12">
    <div class="form-group">
      <label class="label">Nombre / Razón social <span class="req">*</span></label>
      <input class="input" id="s-nombre" placeholder="Wenhua Textiles Co."/>
    </div>

// Los datos se cargan recién después de que Firebase Auth confirma
// quién es el usuario y que tiene un permiso en la colección "access".
;(async function() {
  let fb
  try {
    const appMod = await import(FB_BASE + 'firebase-app.js')
    const fs = await import(FB_BASE + 'firebase-firestore.js')
    const au = await import(FB_BASE + 'firebase-auth.js')
    const app = appMod.initializeApp(FB_CONFIG)
    fb = { appMod, fs, au, app, db: fs.getFirestore(app), auth: au.getAuth(app) }
    window._fb = fb
  } catch (e) {
    console.error('Firebase init error:', e)
    return renderFatal('No se pudo conectar con Firebase. Revisá tu conexión a internet y recargá la página.')
  }
  fb.au.onAuthStateChanged(fb.auth, user => onAuthChange(user).catch(e => {
    console.error(e)
    renderFatal('Error al cargar los datos: ' + (e?.code || e?.message || e))
  }))
})()

async function onAuthChange(user) {
  const fb = window._fb
  // El login reemplaza la página entera; al ingresar, recargamos para volver a armarla.
  if (user && window._loginShown) { location.reload(); return }
  if (!user) { renderLogin(); return }
  if (!user.emailVerified) { renderVerifyEmail(user); return }

  const email = user.email.toLowerCase()
  let accessSnap
  try { accessSnap = await fb.fs.getDoc(fb.fs.doc(fb.db, 'access', email)) }
  catch (e) { if (e?.code !== 'permission-denied') throw e }
  if (!accessSnap || !accessSnap.exists()) { renderNoAccess(email); return }

  const a = accessSnap.data()
  currentUser = { id: email, email, username: email, nombre: a.nombre || email, rol: a.rol === 'admin' ? 'admin' : 'user',
                  empresas: a.empresas ?? 'all', secciones: a.secciones ?? 'all' }

  // Los datos viejos (todo junto en "crm") se pasan una sola vez al formato nuevo.
  const mig = await fb.fs.getDoc(fb.fs.doc(fb.db, 'settings', 'migration'))
  if (!mig.exists()) { currentUser.rol === 'admin' ? renderMigration() : renderMigrationWait(); return }

  await loadData()
  _startApp()
}

function saveError(e) {
  const msg = e?.code === 'permission-denied'
    ? '⚠️ No se guardó: no tenés permiso para este cambio'
    : '⚠️ No se guardó el cambio. Revisá tu conexión y recargá.'
  try { toast(msg) } catch { alert(msg) }
}

/* ════════════════════════════════════
   DATA LAYER — Firebase Firestore
   Cada orden, cliente, presupuesto, etc. es su propio documento.
   El resto del código sigue usando getX()/saveX(lista): saveX compara
   con lo último sincronizado y escribe solo lo que cambió.
════════════════════════════════════ */
// Colecciones con un documento por registro. company:true = el registro pertenece a una empresa.
const COLLS = {
  orders: { company: true }, clients: { company: true }, quotes: { company: true },
  alerts: { company: true }, folders: { company: true },
  suppliers: { company: false }, supplier_folders: { company: false }, products: { company: false },
}
// Ajustes que solo puede cambiar un admin.
const ADMIN_SETTINGS = ['companies', 'users', 'migration']

const _synced = {}   // nombre → Map(id → JSON guardado)
const _pos = {}      // nombre → Map(id → posición, para mantener el orden de las listas)

const DB = {
  get(k) { return window._fbCache?.[k] ?? null },
  set(k, v) {
    window._fbCache[k] = v
    if (COLLS[k]) return syncCollection(k, v)
    const fb = window._fb
    fb.fs.setDoc(fb.fs.doc(fb.db, 'settings', k), { data: JSON.stringify(v ?? null), updatedAt: Date.now(), updatedBy: currentUser?.email || '' })
      .catch(e => { console.error('Error al guardar', k, e); saveError(e) })
  }
}

function syncCollection(name, arr) {
  const fb = window._fb
  const synced = _synced[name], pos = _pos[name]
  const seen = new Set()
  arr.forEach((item, idx) => {
    if (!item || !item.id) return
    seen.add(item.id)
    const json = JSON.stringify(item)
    if (synced.get(item.id) === json) return
    if (!pos.has(item.id)) {
      const vals = [...pos.values()]
      pos.set(item.id, vals.length === 0 ? 0 : idx === 0 && arr.length > 1 ? Math.min(...vals) - 1 : Math.max(...vals) + 1)
    }
    synced.set(item.id, json)
    const payload = { data: json, pos: pos.get(item.id), updatedAt: Date.now(), updatedBy: currentUser?.email || '' }
    if (COLLS[name].company) payload.companyId = item.companyId ?? null
    fb.fs.setDoc(fb.fs.doc(fb.db, name, item.id), payload)
      .catch(e => { console.error('Error al guardar', name, item.id, e); synced.delete(item.id); saveError(e) })
  })
  for (const id of [...synced.keys()]) {
    if (seen.has(id)) continue
    synced.delete(id); pos.delete(id)
    fb.fs.deleteDoc(fb.fs.doc(fb.db, name, id)).catch(e => { console.error('Error al borrar', name, id, e); saveError(e) })
  }
}

// Empresas que el usuario puede ver ('all' o lista de ids).
function myCompanyScope() {
  if (currentUser.rol === 'admin' || currentUser.empresas === 'all') return 'all'
  return Array.isArray(currentUser.empresas) ? currentUser.empresas : []
}

// Escucha una colección en vivo. Resuelve cuando llegó la primera carga.
function listenCollection(name) {
  const fb = window._fb, { fs } = fb
  _synced[name] = new Map(); _pos[name] = new Map()
  const list = window._fbCache[name] = []
  const scope = COLLS[name].company ? myCompanyScope() : 'all'
  const queries = scope === 'all'
    ? [fs.collection(fb.db, name)]
    : scope.map(cid => fs.query(fs.collection(fb.db, name), fs.where('companyId', '==', cid)))
  return Promise.all(queries.map(q => new Promise((resolve, reject) => {
    let first = true
    fs.onSnapshot(q, snap => {
      let changed = false
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id
        const i = list.findIndex(x => x.id === id)
        if (ch.type === 'removed') {
          if (_synced[name].has(id) || i >= 0) { _synced[name].delete(id); _pos[name].delete(id); if (i >= 0) list.splice(i, 1); changed = true }
          return
        }
        const d = ch.doc.data()
        _pos[name].set(id, d.pos ?? 0)
        if (_synced[name].get(id) === d.data) return
        let item; try { item = JSON.parse(d.data) } catch { return }
        _synced[name].set(id, d.data)
        if (i >= 0) list[i] = item
        else {
          const p = d.pos ?? 0
          const at = list.findIndex(x => (_pos[name].get(x.id) ?? 0) > p)
          at < 0 ? list.push(item) : list.splice(at, 0, item)
        }
        changed = true
      })
      if (first) { first = false; resolve(); return }
      if (changed && !snap.metadata.hasPendingWrites) scheduleRender()
    }, err => {
      console.error('Error escuchando', name, err)
      if (first) { first = false; reject(err) } else toast('⚠️ Se cortó la actualización en vivo. Recargá la página.')
    })
  })))
}

async function loadData() {
  const fb = window._fb
  const snap = await fb.fs.getDocs(fb.fs.collection(fb.db, 'settings'))
  snap.forEach(d => { try { window._fbCache[d.id] = JSON.parse(d.data().data) } catch {} })
  await Promise.all(Object.keys(COLLS).map(listenCollection))
}

// Cuando otro usuario cambia algo, se redibuja la pantalla, pero nunca
// con un formulario abierto o mientras alguien escribe.
let _renderPending = false
function scheduleRender() { _renderPending = true; tryRender() }
let _dqSig = ''
function tryRender() {

  // "Datos a completar": si algo se arregló desde una ventana (pagos, valores reales), refrescar al cerrarla.
  try {

  } catch {}
  if (!_renderPending) return
  const ae = document.activeElement
  const typing = ae && ae.closest?.('#content') && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)
  if (document.querySelector('.modal-overlay.open') || typing || currentPage === 'calc') return
  _renderPending = false
  renderCompanySelector(); renderPage()
}
setInterval(tryRender, 1500)

/* ── Archivos adjuntos: colección "files", partidos en pedazos ── */
const FILE_CHUNK = 700000          // caracteres por pedazo (cada documento admite ~1 MB)
const FILE_MAX_BYTES = 10 * 1024 * 1024

async function storeFile(dataUrl, meta) {
  const fb = window._fb, { fs } = fb
  const id = uid() + uid()
  const n = Math.ceil(dataUrl.length / FILE_CHUNK)
  await fs.setDoc(fs.doc(fb.db, 'files', id), { ...meta, chunks: n, createdAt: Date.now(), createdBy: currentUser?.email || '' })
  for (let i = 0; i < n; i++) {
    await fs.setDoc(fs.doc(fb.db, 'files', id, 'chunks', String(i)), { data: dataUrl.slice(i * FILE_CHUNK, (i + 1) * FILE_CHUNK) })
  }
  return id
}

async function loadFileData(fileId) {
  const fb = window._fb, { fs } = fb
  const meta = await fs.getDoc(fs.doc(fb.db, 'files', fileId))
  if (!meta.exists()) throw new Error('El archivo no existe')
  const parts = await Promise.all(Array.from({ length: meta.data().chunks }, (_, i) =>
    fs.getDoc(fs.doc(fb.db, 'files', fileId, 'chunks', String(i))).then(s => s.data().data)))
  return parts.join('')
}

async function deleteStoredFile(fileId) {
  const fb = window._fb, { fs } = fb
  try {
    const meta = await fs.getDoc(fs.doc(fb.db, 'files', fileId))
    if (!meta.exists()) return
    for (let i = 0; i < meta.data().chunks; i++) await fs.deleteDoc(fs.doc(fb.db, 'files', fileId, 'chunks', String(i)))
    await fs.deleteDoc(fs.doc(fb.db, 'files', fileId))
  } catch (e) { console.error('Error al borrar archivo', fileId, e) }
}

function readAsDataUrl(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsDataURL(file) })
}

const PAGE_TITLES = { order:'Orden', dataquality:'Datos a completar',cashflow:'Flujo de caja', analysis:'Estimado vs. real', products:'Catálogo de productos', dashboard:'Dashboard', calendar:'Calendario', pagos:'Pagos pendientes', orders:'Órdenes', tracking:'Tracking naval', costs:'Costos y gastos', calc:'Calculadora de Landed Cost', clients:'Clientes', quotes:'Presupuestos', suppliers:'Proveedores', companies:'Empresas', users:'Usuarios' }
const PAGE_ACTIONS = { products:'+ Producto', dashboard:null, calendar:'+ Nueva alerta', folders:'+ Nueva carpeta', orders:'+ Nueva orden', tracking:null, costs:null, calc:null, clients:'+ Nuevo cliente', quotes:'+ Nuevo presupuesto', suppliers:'+ Proveedor', companies:'+ Empresa' }
const PAGE_ACTION_FNS = { products:()=>openProductModal(), calendar:()=>openAlertModal(), folders:()=>openModal('modal-folder'), orders:openNewOrder, clients:openNewClient, quotes:()=>nav('calc'), suppliers:openNewSupplier, companies:()=>openModal('modal-company') }

// Pantallas que no están en el menú: qué permiso usan y qué ítem del menú marcan.
const PAGE_SECTION = { order: 'orders' }
const PAGE_MENU = { order: 'orders', pagos: 'cashflow', dataquality: 'dashboard', calendar: 'dashboard', tracking: 'orders', costs: 'orders', folders: 'orders' }
// Pantallas rediseñadas: tienen su propio encabezado, sin la barra superior vieja.
// Pantallas con encabezado propio; las demás reciben el encabezado común (genericHeader).
const REDESIGNED = ['dashboard', 'orders', 'order', 'cashflow', 'calc', 'quotes', 'clients', 'suppliers', 'companies']

function nav(page) {
  // Permission guard
  if (page !== 'users' && typeof currentUser !== 'undefined' && currentUser && !userCanSee(PAGE_SECTION[page] || page)) {
    const firstVisible = ALL_SECTIONS.find(([k])=>userCanSee(k))
    page = firstVisible ? firstVisible[0] : page
  }
  if (page === 'users' && currentUser?.rol !== 'admin') return
  currentPage = page
  const menuKey = PAGE_MENU[page] || page
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', (el.getAttribute('onclick')||'').includes("nav('" + menuKey + "')")))
  document.querySelector('.topbar').style.display = 'none'
  const contentEl = document.getElementById('content'); if (contentEl) contentEl.scrollTop = 0
  document.getElementById('page-title').textContent = PAGE_TITLES[page] || page
  const btn = document.getElementById('topbar-action')
  if(PAGE_ACTIONS[page]) { btn.textContent = PAGE_ACTIONS[page]; btn.style.display=''; }
  else btn.style.display='none'
  renderPage()
}

function topbarAction() { if(PAGE_ACTION_FNS[currentPage]) PAGE_ACTION_FNS[currentPage]() }

function handleSearch(q) {
  if(currentPage==='orders') renderOrdersPage(q)
}

function renderPage() {
  const el = document.getElementById('content')
  const pages = { order:renderOrderPage, dataquality:renderDataQuality, cashflow:renderCaja, analysis:renderAnalysis, products:renderProducts, dashboard:renderHome, calendar:renderCalendar, pagos:renderPagos, orders:renderOrdersV2, tracking:renderTracking, costs:renderCosts, calc:renderCalc, clients:renderClientsV2, quotes:renderQuotesV2, suppliers:renderSuppliersV2, companies:renderCompaniesV2, users:renderUsers }
  if(pages[currentPage]) el.innerHTML = (REDESIGNED.includes(currentPage) ? '' : genericHeader(currentPage)) + pages[currentPage]()
  if(currentPage === 'calc') setTimeout(initCalcPage, 0)
  updateDataQualityBadge()
}

function fmtUSD(n) { return '$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function fmtDate(d) { if(!d) return '—'; try { return new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}) } catch { return d } }
function fmtDateFull(d) { if(!d) return ''; try { return new Date(d+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}) } catch { return d } }
function daysUntil(d) { if(!d) return ''; const diff=Math.round((new Date(d+'T12:00:00')-new Date())/86400000); if(diff<0) return `hace ${Math.abs(diff)}d`; if(diff===0) return 'hoy'; return `en ${diff}d` }
function badge(estado) { return `<span class="badge b-${estado}"><span class="badge-dot dot-${estado}"></span>${S_LABELS[estado]||estado}</span>` }
function ordersByCompany() { return getOrders().filter(o=>o.companyId===currentCompanyId) }
function totalPagos(o) { return (o.pagos||[]).reduce((s,p)=>s+(Number(p.monto)||0),0) }
function totalCostosCat(o, cat) { return (o.costos||[]).filter(c=>c.cat===cat).reduce((s,c)=>s+(Number(c.monto)||0),0) }
function totalCostos(o) { return (o.costos||[]).reduce((s,c)=>s+(Number(c.monto)||0),0) }
function landedCost(o) { return (Number(o.fob_total)||0) + totalCostos(o) }

function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show')
  setTimeout(()=>el.classList.remove('show'),2500)
}
function openModal(id) { document.getElementById(id).classList.add('open') }
function closeModal(id) { document.getElementById(id).classList.remove('open') }

let _kbDragging = null

function kbDragStart(e, id) {
  _kbDragging = id
  e.dataTransfer.effectAllowed = 'move'
  e.dataTransfer.setData('text/plain', id)
  setTimeout(() => e.target.classList.add('dragging'), 0)
}

function kbDragEnd(e) {
  e.target.classList.remove('dragging')
  document.querySelectorAll('.kb-col-body').forEach(el => el.classList.remove('drag-over'))
  _kbDragging = null
}

function kbDragOver(e, el) {
  e.preventDefault()
  e.dataTransfer.dropEffect = 'move'
  document.querySelectorAll('.kb-col-body').forEach(c => c.classList.remove('drag-over'))
  el.classList.add('drag-over')
}

function kbDragLeave(e, el) {
  if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over')
}

function kbDrop(e, el, newEstado) {
  e.preventDefault()
  el.classList.remove('drag-over')
  const id = e.dataTransfer.getData('text/plain') || _kbDragging
  if (!id) return
  const orders = getOrders()
  const idx = orders.findIndex(o => o.id === id)
  if (idx < 0) return
  const oldEstado = orders[idx].estado
  if (oldEstado === newEstado) return
  orders[idx].estado = newEstado
  trackOrderChange(orders[idx], oldEstado)
  saveOrders(orders)
  const faltan = docsMissing(orders[idx])
  toast(faltan.length ? `${orders[idx].code} → ${S_LABELS[newEstado]} · ⚠️ faltan: ${faltan.map(d=>d.label).join(', ')}` : `${orders[idx].code} → ${S_LABELS[newEstado]}`)
  renderPage()
  if (newEstado === 'entregado' && oldEstado !== 'entregado') {
    setTimeout(() => openRealValuesModal(id), 400)
  }
}

const PAGO_METODOS = ['Cuenta exterior','Cuenta Chile','Tarjeta de crédito','Transferencia','Western Union','Efectivo']

function renderPagos(compact) {
  const activas = ordersByCompany().filter(o=>o.estado!=='entregado')
  const pend = activas.map(o=>{
    const fob=Number(o.fob_total)||0
    const pagado=totalPagos(o)
    const saldo=Math.max(0, fob-pagado)
    return { o, fob, pagado, saldo }
  }).filter(x=>x.saldo>0)
  pend.sort((a,b)=>{ const fa=a.o.fin_prod||'9999-99', fb=b.o.fin_prod||'9999-99'; return fa<fb?-1:fa>fb?1:0 })

  const totalPend=pend.reduce((s,x)=>s+x.saldo,0)
  const totalPagado=pend.reduce((s,x)=>s+x.pagado,0)
  const totalFob=pend.reduce((s,x)=>s+x.fob,0)

  if(!pend.length) {
    return `<div class="card" style="text-align:center;padding:40px;color:var(--text3)">
      <div style="font-size:34px;margin-bottom:10px">✅</div>
      <div style="font-weight:600;color:var(--text2)">No hay pagos pendientes en las órdenes activas.</div>
      <div style="font-size:12px;margin-top:4px">Cuando una orden activa tenga saldo por abonar, aparece acá.</div>
    </div>`
  }

  const now=new Date()
  return `
  <div style="display:${compact?'none':'grid'};grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
    <div class="card"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">Falta abonar</div><div style="font-size:22px;font-weight:800;color:var(--amber-t)">${fmtUSD(totalPend)}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${pend.length} orden${pend.length!==1?'es':''} activa${pend.length!==1?'s':''}</div></div>
    <div class="card"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">Ya pagado</div><div style="font-size:22px;font-weight:800;color:var(--green-t)">${fmtUSD(totalPagado)}</div></div>
    <div class="card"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">FOB total</div><div style="font-size:22px;font-weight:800">${fmtUSD(totalFob)}</div></div>
  </div>
  <datalist id="pago-metodos">${PAGO_METODOS.map(m=>`<option value="${m}">`).join('')}</datalist>
  <div class="table-wrap"><table>
    <thead><tr><th>Orden</th><th>Proveedor</th><th>Estado</th><th>Fin producción</th><th>FOB</th><th>Pagado</th><th>Falta abonar</th><th>Forma de pago</th></tr></thead>
    <tbody>
    ${pend.map(({o,fob,pagado,saldo})=>{
      const fpPast = o.fin_prod && new Date(o.fin_prod+'T12:00:00') < now && o.estado==='produccion'
      const fp = o.fin_prod ? `<span class="${fpPast?'text-amber':''}" style="${fpPast?'font-weight:700':''}">${fmtDate(o.fin_prod)}${fpPast?' ⚠️':''}</span>` : '<span class="text-muted">—</span>'
      const lbl=(o.pagoLabel||'').replace(/"/g,'&quot;')
      return `<tr>
        <td class="mono" style="font-weight:600;cursor:pointer" onclick="openDetail('${o.id}')" title="Abrir orden">${o.code}</td>
        <td class="td-sm">${o.proveedor||'—'}</td>
        <td>${badge(o.estado)}</td>
        <td class="td-sm">${fp}</td>
        <td class="money">${fmtUSD(fob)}</td>
        <td class="money text-green">${fmtUSD(pagado)}</td>
        <td class="money text-amber" style="font-weight:800">${fmtUSD(saldo)}</td>
        <td><input class="input" list="pago-metodos" style="padding:4px 8px;font-size:12px;min-width:150px" value="${lbl}" placeholder="ej: Cuenta exterior" onchange="setPagoLabel('${o.id}',this.value)"/></td>
      </tr>`
    }).join('')}
    </tbody>
  </table></div>`
}

function setPagoLabel(orderId, value) {
  const orders = getOrders()
  const idx = orders.findIndex(o=>o.id===orderId)
  if(idx<0) return
  orders[idx].pagoLabel = value.trim()
  saveOrders(orders)
  toast('Forma de pago guardada ✓')
}

function renderOrdersPage(search='') {
  let orders = ordersByCompany()
  if(folderFilter) orders = orders.filter(o=>o.folderId===folderFilter)
  if(search) {
    const q=search.toLowerCase()
    orders = orders.filter(o=>
      (o.code||'').toLowerCase().includes(q)||(o.proveedor||'').toLowerCase().includes(q)||
      (o.bl||'').toLowerCase().includes(q)||(o.categoria||'').toLowerCase().includes(q)
    )
  }
  const states = ['all',...S_ORDER]
  return `
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
    <div class="filter-bar" style="margin:0;flex:1" id="ord-filters">
      ${states.map((s,i)=>`<div class="chip${s==='all'?' active':''}" onclick="filterOrders(this,'${s}')">${s==='all'?'Todas':S_LABELS[s]}</div>`).join('')}
    </div>
    ${folderFilter?`<button class="btn btn-ghost btn-sm" onclick="folderFilter=null;renderPage()">✕ Quitar filtro carpeta</button>`:''}
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    ${orders.length===0?`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Sin órdenes</div><p class="empty-desc">Creá una nueva orden.</p></div>`:`
    <div class="table-wrap"><table id="orders-table">
      <thead><tr><th>Orden</th><th>Proveedor</th><th>Cat.</th><th>Estado</th><th>FOB</th><th>Pagado</th><th>Saldo</th><th>CBM</th><th>ETA</th><th>Avance</th></tr></thead>
      <tbody>${orders.map(o=>{
        const pagado=totalPagos(o); const fob=Number(o.fob_total)||0; const saldo=Math.max(0,fob-pagado)
        const cbm = o.contenedores?.reduce((s,c)=>s+(Number(c.cbm)||0),0)||Number(o.cbm_est)||0
        return `<tr onclick="openDetail('${o.id}')">
          <td class="mono" style="font-weight:600">${o.code}</td>
          <td class="td-sm">${o.proveedor||'—'}</td>
          <td class="td-sm">${o.categoria||'—'}</td>
          <td>${badge(o.estado)}</td>
          <td class="money">${fmtUSD(fob)}</td>
          <td class="money text-green">${fmtUSD(pagado)}</td>
          <td class="money ${saldo>0?'text-amber':'text-muted'}">${saldo>0?fmtUSD(saldo):'—'}</td>
          <td class="td-sm">${cbm?cbm.toFixed(1)+' m³':'—'}</td>
          <td class="td-sm">${o.eta?`<span>${fmtDate(o.eta)}</span><br><span style="font-size:10px;color:var(--text3)">${daysUntil(o.eta)}</span>`:'—'}</td>
          <td><div class="prog-bar"><div class="prog-fill" style="width:${S_PROG[o.estado]||5}%"></div></div></td>
        </tr>`}).join('')}
      </tbody>
    </table></div>`}
  </div>`
}

function filterOrders(el, estado) {
  document.querySelectorAll('#ord-filters .chip').forEach(c=>c.classList.remove('active'))
  el.classList.add('active')
  let orders = ordersByCompany()
  if(folderFilter) orders = orders.filter(o=>o.folderId===folderFilter)
  if(estado!=='all') orders = orders.filter(o=>o.estado===estado)
  const tbody = document.querySelector('#orders-table tbody')
  if(!tbody) return
  tbody.innerHTML = orders.map(o=>{
    const pagado=totalPagos(o); const fob=Number(o.fob_total)||0; const saldo=Math.max(0,fob-pagado)
    const cbm = o.contenedores?.reduce((s,c)=>s+(Number(c.cbm)||0),0)||Number(o.cbm_est)||0
    return `<tr onclick="openDetail('${o.id}')">
      <td class="mono" style="font-weight:600">${o.code}</td>
      <td class="td-sm">${o.proveedor||'—'}</td><td class="td-sm">${o.categoria||'—'}</td>
      <td>${badge(o.estado)}</td>
      <td class="money">${fmtUSD(fob)}</td>
      <td class="money text-green">${fmtUSD(pagado)}</td>
      <td class="money ${saldo>0?'text-amber':'text-muted'}">${saldo>0?fmtUSD(saldo):'—'}</td>
      <td class="td-sm">${cbm?cbm.toFixed(1)+' m³':'—'}</td>
      <td class="td-sm">${o.eta?fmtDate(o.eta):'—'}</td>
      <td><div class="prog-bar"><div class="prog-fill" style="width:${S_PROG[o.estado]||5}%"></div></div></td>
    </tr>`}).join('')
}

// openDetail y renderDetailTabs ahora abren la página de la orden (ver "Detalle de orden (página)").

function detTabContent(o, tab) {
  if(tab==='general') return detGeneral(o)
  if(tab==='productos') return detProductos(o)
  if(tab==='pagos') return detPagos(o)
  if(tab==='contenedores') return detContenedores(o)
  if(tab==='costos') return detCostos(o)
  if(tab==='documentos') return detDocumentos(o)
  if(tab==='archivos') return detArchivos(o)
  if(tab==='timeline') return detTimeline(o)
  return ''
}

function detGeneral(o) {
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
    ${[['Naviera',o.naviera],['Buque',o.buque],['Bill of Lading',o.bl],['ETD',fmtDateFull(o.etd)],['ETA Buenos Aires',fmtDateFull(o.eta)],['Puerto origen',o.puerto],['Incoterm',o.incoterm],['Tipo contenedor',o.contenedores?.map(c=>c.tipo).join(' + ')||'—']].map(([l,v])=>`
    <div>
      <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px">${l}</div>
      <div style="font-size:13px;font-weight:500;${!v?'color:var(--text3);font-style:italic':''};font-family:${['Bill of Lading','Buque'].includes(l)?'var(--mono)':'var(--font)'}">${v||'Pendiente'}</div>
    </div>`).join('')}
  </div>
  ${o.eta?`<div style="background:var(--blue-bg);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--blue-t);font-weight:600;margin-bottom:8px">⏱ ${daysUntil(o.eta)} para la llegada — ETA ${fmtDate(o.eta)}</div>`:''}
  ${o.novedades?`<div style="background:var(--amber-bg);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--amber-t);margin-top:6px"><strong>Novedad:</strong> ${o.novedades}</div>`:''}`
}

function detProductos(o) {
  const prods = o.productos||[]
  if(!prods.length) return '<p class="text-muted" style="font-size:13px">Sin productos.</p>'
  return `<div>${prods.map(p=>`
    <div style="background:var(--surface2);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;align-items:center">
      <div><div style="font-size:12px;font-weight:700">${p.desc}</div></div>
      <div><div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase">Cantidad</div><div class="money" style="font-size:13px">${Number(p.qty).toLocaleString('es-AR')} un.</div></div>
      <div><div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase">FOB unit.</div><div class="money" style="font-size:13px">${fmtUSD(p.price)}</div></div>
      <div><div style="font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase">FOB total</div><div class="money text-blue" style="font-size:13px">${fmtUSD((p.qty||0)*(p.price||0))}</div></div>
    </div>`).join('')}
  <div style="text-align:right;padding:8px 0;font-size:14px;font-weight:700;border-top:1px solid var(--border)">
    Total FOB: <span class="text-blue">${fmtUSD(o.fob_total||0)}</span>
  </div></div>`
}

function detPagos(o) {
  const pagos = o.pagos||[]
  const fob = Number(o.fob_total)||0
  const pagado = totalPagos(o)
  const saldo = Math.max(0, fob - pagado)
  const pct = fob ? Math.min(100, Math.round(pagado/fob*100)) : 0

  // Only show client payments if linked quote is para-cliente (has fee > 0)
  const linkedQuote = o.quoteId ? getQuotes().find(q=>q.id===o.quoteId) : null
  const isParaMi = linkedQuote ? (linkedQuote._paraMi === true || ((linkedQuote.costoDetalle?.total_fee||0) === 0 && (linkedQuote.costoDetalle?.iva_fee||0) === 0)) : true
  const clientTotal = (linkedQuote && !isParaMi) ? linkedQuote.total : null
  const clientPagado = (linkedQuote && !isParaMi) ? (linkedQuote.pagos||[]).reduce((s,p)=>s+(Number(p.monto)||0),0) : null
  const clientSaldo = clientTotal !== null ? Math.max(0, clientTotal - clientPagado) : null
  const clientPct = clientTotal ? Math.min(100, Math.round(clientPagado/clientTotal*100)) : 0

  return `
  ${clientTotal !== null ? `
  <!-- PAGOS DEL CLIENTE (desde presupuesto vinculado) -->
  <div style="background:var(--green-bg);border:1px solid #BBF7D0;border-radius:var(--r);padding:12px 14px;margin-bottom:14px">
    <div style="font-size:10px;font-weight:700;text-transform:uppercase;font-family:var(--mono);color:var(--green-t);margin-bottom:8px;letter-spacing:.5px">💰 Pagos del cliente — Presupuesto ${linkedQuote.code}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px">
      <div style="text-align:center">
        <div style="font-size:10px;color:var(--green-t);font-weight:700;text-transform:uppercase;font-family:var(--mono)">Total presupuesto</div>
        <div class="money text-green" style="font-size:16px">${fmtUSD(clientTotal)}</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:10px;color:var(--green-t);font-weight:700;text-transform:uppercase;font-family:var(--mono)">Cobrado</div>
        <div class="money text-green" style="font-size:16px">${fmtUSD(clientPagado)}</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:10px;color:var(--green-t);font-weight:700;text-transform:uppercase;font-family:var(--mono)">Saldo cliente</div>
        <div class="money" style="font-size:16px;color:${clientSaldo>0?'var(--amber-t)':'var(--green-t)'}">${clientSaldo>0?fmtUSD(clientSaldo):'✓ Cobrado'}</div>
      </div>
    </div>
    <div style="height:6px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden">
      <div style="height:100%;background:var(--green);width:${clientPct}%;border-radius:3px"></div>
    </div>
    <div style="font-size:10px;color:var(--green-t);margin-top:3px;font-family:var(--mono)">${clientPct}% cobrado al cliente</div>
    ${(linkedQuote.pagos||[]).length>0?`<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">${(linkedQuote.pagos||[]).map(p=>`
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-top:1px solid rgba(0,0,0,.06)">
        <span style="font-weight:600;color:var(--green-t)">${p.tipo||'pago'}</span>
        <span style="color:var(--text2);font-family:var(--mono)">${fmtDate(p.fecha)}</span>
        <span class="money text-green">${fmtUSD(p.monto)}</span>
      </div>`).join('')}</div>`:'<div style="font-size:11px;color:var(--green-t);margin-top:6px;opacity:.7">Sin pagos del cliente registrados. Registralos desde Presupuestos.</div>'}
  </div>` : ''}

  <!-- PAGOS AL PROVEEDOR -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <div>
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;font-family:var(--mono);color:var(--text2);margin-bottom:4px">Pagos al proveedor (FOB)</div>
      <div style="font-size:12px;color:var(--text2)">Pagado: <span class="money text-green">${fmtUSD(pagado)}</span> de <span class="money">${fmtUSD(fob)}</span></div>
      ${saldo>0?`<div style="font-size:12px;color:var(--amber-t);font-weight:600">Saldo pendiente: ${fmtUSD(saldo)}</div>`:'<div style="font-size:12px;color:var(--green-t);font-weight:600">✓ Pagado completamente</div>'}
    </div>
    <button class="btn btn-primary btn-sm" onclick="openPagoModal('${o.id}')">+ Registrar pago</button>
  </div>
  <div style="height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;margin-bottom:4px">
    <div style="height:100%;background:var(--green);width:${pct}%;border-radius:4px;transition:width .3s"></div>
  </div>
  <div style="font-size:10px;color:var(--text3);margin-bottom:12px;font-family:var(--mono)">${pct}% pagado al proveedor</div>
  ${pagos.length===0?'<p class="text-muted" style="font-size:13px">Sin pagos registrados.</p>':
    pagos.map((p,i)=>`<div style="display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;padding:9px 10px;background:var(--surface2);border-radius:var(--r);margin-bottom:6px">
      <div style="font-size:10px;font-weight:700;font-family:var(--mono);padding:2px 7px;border-radius:4px;background:var(--blue-bg);color:var(--blue-t);text-transform:uppercase">${p.tipo||'pago'}</div>
      <div><div style="font-size:12px;font-weight:600">${p.ref||'—'}</div>${p.notas?`<div style="font-size:11px;color:var(--text3)">${p.notas}</div>`:''}</div>
      <div style="font-size:11px;color:var(--text3);font-family:var(--mono)">${fmtDate(p.fecha)}</div>
      <div class="money text-green" style="font-size:14px">${fmtUSD(p.monto)}</div>
      <button class="btn btn-ghost btn-xs" onclick="deletePago('${o.id}',${i});openDetail('${o.id}')">✕</button>
    </div>`).join('')}`
}

function detCostos(o) {
  const fob = Number(o.fob_total)||0
  const totalC = totalCostos(o)
  const landed = fob + totalC

  // Find linked quote for full calculator breakdown
  const linkedQuote = o.quoteId ? getQuotes().find(q=>q.id===o.quoteId) : null
  const cd = linkedQuote?.costoDetalle || null
  const flete = linkedQuote ? (Number(linkedQuote.flete)||0) : 0
  // seguro = (fob + flete) * seguro_pct — stored implicitly in cd via total_locales
  // We need to reconstruct: landed = fob + flete + seguro + trib + locales + fee + iva_fee
  // The calculadora already computes CIF = fob + flete + seguro, and trib/locales/fee on top
  // So: full landed = fob + flete + cd.total_trib + cd.total_locales + cd.total_fee + cd.iva_fee
  const fullLanded = cd ? (fob + flete + (cd.total_trib||0) + (cd.total_locales||0) + (cd.total_fee||0) + (cd.iva_fee||0)) : landed

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:12px;color:var(--text2)">${linkedQuote?`Vinculado al presupuesto <strong>${linkedQuote.code}</strong>`:'Sin presupuesto vinculado'}${o._valoresReales?' · <span style="color:var(--green-t);font-weight:700">✓ Valores reales cargados</span>':''}</div>
    <div style="display:flex;gap:6px">
      ${o.estado==='entregado'?`<button class="btn btn-sm" onclick="openRealValuesModal('${o.id}')">📦 ${o._valoresReales?'Editar':'Cargar'} valores reales</button>`:''}
      ${o._valoresReales?`<button class="btn btn-success btn-sm" onclick="openOrderSummaryModal('${o.id}')">📄 Resumen final</button>`:''}
      <button class="btn btn-primary btn-sm" onclick="openCostoModal('${o.id}')">+ Agregar costo extra</button>
    </div>
  </div>

  <!-- KPI STRIP -->
  <div style="display:grid;grid-template-columns:repeat(${cd?5:3},1fr);gap:10px;margin-bottom:14px">
    <div class="card-flat" style="text-align:center">
      <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;font-family:var(--mono);margin-bottom:4px">FOB Mercadería</div>
      <div class="money text-blue" style="font-size:16px">${fmtUSD(fob)}</div>
    </div>
    ${cd?`
    <div class="card-flat" style="text-align:center">
      <div style="font-size:10px;font-weight:700;color:var(--teal-t);text-transform:uppercase;font-family:var(--mono);margin-bottom:4px">Flete int.</div>
      <div class="money" style="font-size:16px;color:var(--teal-t)">${fmtUSD(flete)}</div>
    </div>
    <div class="card-flat" style="text-align:center">
      <div style="font-size:10px;font-weight:700;color:var(--red-t);text-transform:uppercase;font-family:var(--mono);margin-bottom:4px">Tributos</div>
      <div class="money text-red" style="font-size:16px">${fmtUSD(cd.total_trib)}</div>
    </div>
    <div class="card-flat" style="text-align:center">
      <div style="font-size:10px;font-weight:700;color:var(--amber-t);text-transform:uppercase;font-family:var(--mono);margin-bottom:4px">Gastos op.</div>
      <div class="money text-amber" style="font-size:16px">${fmtUSD(cd.total_locales)}</div>
    </div>`:`<div class="card-flat" style="text-align:center">
      <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;font-family:var(--mono);margin-bottom:4px">Gastos cargados</div>
      <div class="money text-amber" style="font-size:16px">${fmtUSD(totalC)}</div>
    </div>`}
    <div class="card-flat" style="text-align:center;background:var(--blue-bg)">
      <div style="font-size:10px;font-weight:700;color:var(--blue-t);text-transform:uppercase;font-family:var(--mono);margin-bottom:4px">Landed Cost</div>
      <div class="money text-blue" style="font-size:16px">${fmtUSD(fullLanded)}</div>
    </div>
  </div>

  ${cd ? `
  <!-- DESGLOSE COMPLETO DE LA CALCULADORA -->
  <div style="margin-bottom:14px">

          <button class="btn btn-ghost btn-xs" style="color:var(--red-t)" onclick="deleteFile('${o.id}',${files.indexOf(f)});openDetail('${o.id}')">✕</button>
        </div>`).join('') : `<div style="padding:7px 12px;font-size:11px;color:var(--text3);font-style:italic">Sin archivo</div>`}

async function previewFile(orderId, fileIdx) {
  const o = getOrders().find(x=>x.id===orderId)
  if (!o) return
  const f = (o.archivos||[])[fileIdx]
  if (!f || !(f.data || f.fileId)) { toast('Sin datos de vista previa'); return }
  const viewable = f.ext === 'pdf' || ['jpg','jpeg','png','gif','webp'].includes(f.ext)
  // La ventana se abre antes de descargar, para que el navegador no la bloquee.
  const win = viewable ? window.open('', '_blank') : null
  if (win) win.document.write('<p style="font-family:sans-serif;padding:24px">Cargando archivo…</p>')
  let dataUrl
  try { dataUrl = f.data || await loadFileData(f.fileId) }
  catch (e) { console.error(e); win?.close(); toast('⚠️ No se pudo abrir el archivo'); return }
  const url = URL.createObjectURL(await (await fetch(dataUrl)).blob())
  if (win) { win.location.href = url; return }
  const a = document.createElement('a')
  a.href = url; a.download = f.nombre; document.body.appendChild(a); a.click(); a.remove()
  toast('Descargando ' + f.nombre)
}

function detTimeline(o) {
  const idx = S_ORDER.indexOf(o.estado)
  const ev = (name, date, note, status) => ({ name, date, note, status })
  const events = [
    ev('Muestra / Cotización inicial', o.createdAt, null, idx>0?'done':'active'),
    ev('Cotización confirmada', o.createdAt, o.notas, idx>=1?'done':idx===0?'active':'pending'),
    ev('Pedido confirmado'+( o.tipo_pago?` — ${o.tipo_pago}`:'')+( o.monto_pago?` · ${fmtUSD(o.monto_pago)}`:'' ), o.fecha_pago, null, idx>=2?'done':idx===1?'active':'pending'),
    ev('En producción'+(o.fin_prod?` — Fin est. ${fmtDate(o.fin_prod)}`:''), o.fecha_pago, o.notas_prod, idx>=3?'done':idx===2?'active':'pending'),
    ev('BL emitido — '+(o.naviera||'—')+(o.bl?` · ${o.bl}`:''), o.etd, (o.contenedores||[]).map(c=>c.nro).join(', ')||null, idx>=4?'done':idx===3?'active':'pending'),
    ev('Zarpe desde '+(o.puerto||'origen'), o.etd, null, idx>=4?'done':'pending'),
    idx===4?ev('En tránsito marítimo', null, o.novedades, 'active'):idx>4?ev('En tránsito', null, null,'done'):ev('En tránsito', null, null,'pending'),
    ev('Arribo Buenos Aires'+(o.eta?` — ETA ${fmtDate(o.eta)}`:''), o.eta, null, idx>=5?idx===5?'active':'done':'pending'),
    ev('Despacho aduanero y entrega', null, null, idx>=6?'done':'pending'),
  ]
  return `<div class="tl">${events.map((e,i)=>`<div class="tl-item">
    <div class="tl-left">
      <div class="tl-dot ${e.status}"></div>
      ${i<events.length-1?'<div class="tl-line"></div>':''}
    </div>
    <div class="tl-body">
      <div class="tl-name">${e.name}</div>
      ${e.date?`<div class="tl-date">${fmtDateFull(e.date)}</div>`:''}
      ${e.note?`<div class="tl-note">${e.note}</div>`:''}
    </div>
  </div>`).join('')}</div>`
}

function openNewOrder(existing) {
  orderDraft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: uid(),
    companyId: currentCompanyId,
    code: generateCode(),
    estado:'cotizacion',
    createdAt: new Date().toISOString().slice(0,10),
    productos:[], pagos:[], contenedores:[], costos:[], archivos:[],
  }
  const startStep = existing ? (S_STEP[existing.estado]||1) : 1
  renderOrderStep(startStep)
  document.getElementById('order-modal-title').textContent = existing ? `Editar — ${existing.code}` : 'Nueva orden de importación'
  openModal('modal-order')
}

function generateCode() {
  const orders = getOrders().filter(o=>o.companyId===currentCompanyId)
  return 'OP-'+new Date().getFullYear()+'-'+String(orders.length+1).padStart(3,'0')
}

function renderOrderStep(n) {
  // Stepper UI
  document.getElementById('order-stepper').innerHTML = STEPS.map((s,i)=>{
    const num=i+1
    const cls = num<n?'done':num===n?'active':''
    return `<div class="step-wrap" style="${num===4?'flex:none':''}">
      <div class="step-node">
        <div class="step-circle ${cls}">${cls==='done'?'✓':num}</div>
        <div class="step-label ${num===n?'active':''}">${s.label}</div>
      </div>
      ${num<4?`<div class="step-line ${num<n?'done':''}"></div>`:''}
    </div>`}).join('')

  // Step content
  const content = {
    1: stepContent1,
    2: stepContent2,
    3: stepContent3,
    4: stepContent4,
  }
  document.getElementById('order-step-content').innerHTML = (content[n]||stepContent1)()
  window._currentOrderStep = n
}
